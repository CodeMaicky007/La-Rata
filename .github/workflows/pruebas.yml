name: Pruebas
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node build-app.js
      - name: La carpeta public/ está al día
        run: git diff --exit-code public/ || (echo "Ejecuta 'npm run build' y sube los cambios de public/" && exit 1)
      - run: npm test
