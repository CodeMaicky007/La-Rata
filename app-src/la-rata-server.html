<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Rata</title>
<meta name="description" content="Juego de cartas La Rata: cada uno en su móvil y con su carta.">
<meta name="theme-color" content="#04260d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Rata">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/*BASE_CSS*/

/* ---------- app con servidor ---------- */
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---- intro ---- */
.intro { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; padding-bottom: 12vh; overflow: hidden; cursor: pointer;
  background: radial-gradient(90% 70% at 50% 45%, #146a33 0%, #0b4a22 45%, #031a09 100%); }
.intro::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 45%, transparent 50%, rgba(0,0,0,.6)); pointer-events: none; }
.intro-rayos { position: absolute; width: 170vmax; aspect-ratio: 1; border-radius: 50%; opacity: 0;
  background: repeating-conic-gradient(from 0deg, rgba(255,214,110,.16) 0 7deg, transparent 7deg 18deg);
  -webkit-mask-image: radial-gradient(circle, #000 10%, transparent 60%); mask-image: radial-gradient(circle, #000 10%, transparent 60%);
  animation: rayos-entra .9s .3s ease-out forwards, gira 22s linear infinite; }
@keyframes rayos-entra { to { opacity: 1; } }
@keyframes gira { to { transform: rotate(360deg); } }
.intro-logo { position: relative; z-index: 2; width: min(80vw, 44vh, 420px); aspect-ratio: 1; object-fit: cover;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 62%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 62%, transparent 71%);
  filter: drop-shadow(0 20px 40px rgba(0,0,0,.6));
  animation: logo-entra 1.1s cubic-bezier(.2,1.5,.35,1) both, logo-respira 3s 1.2s ease-in-out infinite; }
@keyframes logo-entra { 0% { transform: scale(.2) rotate(-14deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes logo-respira { 50% { transform: scale(1.03); } }
.intro-cartas { position: relative; z-index: 1; --w: min(19vw, 13vh, 100px); width: 0; height: calc(var(--w) * 1.62); flex-shrink: 0; }
.intro-cartas .naipe { --w: inherit; position: absolute; left: calc(var(--w) / -2); top: 0; opacity: 0; transform-origin: 50% 100%; animation: abanico .9s cubic-bezier(.2,1.2,.3,1) forwards; }
.intro-cartas .naipe:nth-child(1) { --r: -15deg; --tx: calc(var(--w) * -1.6); --ty: calc(var(--w) * .16); animation-delay: .75s; }
.intro-cartas .naipe:nth-child(2) { --r: -5deg; --tx: calc(var(--w) * -.54); --ty: 0px; animation-delay: .85s; }
.intro-cartas .naipe:nth-child(3) { --r: 5deg; --tx: calc(var(--w) * .54); --ty: 0px; animation-delay: .95s; }
.intro-cartas .naipe:nth-child(4) { --r: 15deg; --tx: calc(var(--w) * 1.6); --ty: calc(var(--w) * .16); animation-delay: 1.05s; }
@keyframes abanico { from { opacity: 0; transform: translateY(40vh) rotate(0); } to { opacity: 1; transform: translate(var(--tx), var(--ty)) rotate(var(--r)); } }
.intro-chispas i { position: absolute; z-index: 3; left: var(--x); top: var(--y); width: 6px; height: 6px; border-radius: 50%; background: #ffe7a0; box-shadow: 0 0 10px 3px rgba(255,214,110,.8); opacity: 0; animation: chispa 2.2s var(--d) ease-in-out infinite; }
@keyframes chispa { 0%, 100% { opacity: 0; transform: scale(.3); } 50% { opacity: 1; transform: scale(1); } }
.intro-toca { position: absolute; z-index: 3; bottom: calc(10vh + env(safe-area-inset-bottom, 0px)); font-family: var(--display); font-size: 1.3rem; color: var(--naipe); text-shadow: 0 2px 0 var(--oro-sombra), 0 6px 14px rgba(0,0,0,.6); opacity: 0; animation: aparece-toca .5s 1.8s forwards, late-toca 1.4s 2.3s ease-in-out infinite; }
@keyframes aparece-toca { to { opacity: 1; } }
@keyframes late-toca { 50% { transform: scale(1.08); } }
.intro.sale { animation: intro-sale .48s ease-in forwards; }
@keyframes intro-sale { to { opacity: 0; transform: scale(1.15); } }

/* ---- menú ---- */
.menu { gap: 10px; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); position: relative; }
.menu.oculto { visibility: hidden; }
.menu.aparece > .menu-top { animation: baja .5s .05s cubic-bezier(.2,.9,.3,1.2) both; }
.menu.aparece > .menu-logo { animation: logo-pop .6s .1s cubic-bezier(.2,1.4,.4,1) both; }
.menu.aparece .btn-menu { animation: sube-btn .5s cubic-bezier(.2,1.2,.4,1) both; }
.menu.aparece .btn-menu:nth-child(1) { animation-delay: .18s; }
.menu.aparece .btn-menu:nth-child(2) { animation-delay: .26s; }
.menu.aparece .btn-menu:nth-child(3) { animation-delay: .34s; }
.menu.aparece .btn-menu:nth-child(4) { animation-delay: .42s; }
.menu.aparece .btn-menu:nth-child(5) { animation-delay: .5s; }
.menu.aparece > .tabbar { animation: sube-tab .5s .3s cubic-bezier(.2,.9,.3,1) both; }
@keyframes baja { from { opacity: 0; transform: translateY(-20px); } }
@keyframes logo-pop { from { opacity: 0; transform: scale(.7); } }
@keyframes sube-btn { from { opacity: 0; transform: translateY(24px) scale(.96); } }
@keyframes sube-tab { from { transform: translate(-50%, 100%); } }

/* perfil e iconos de arriba */
.menu-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; position: relative; z-index: 2; }
.perfil { appearance: none; display: flex; align-items: center; gap: 12px; min-width: 0; flex: 0 1 230px; padding: 4px 22px 4px 4px; border-radius: 999px; cursor: pointer; text-align: left;
  background: linear-gradient(180deg, rgba(10,22,12,.85), rgba(4,12,6,.85)); border: 1.5px solid rgba(201,154,58,.55); box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 6px 16px rgba(0,0,0,.35); }
.perfil .avatar { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0;
  background: radial-gradient(circle at 50% 40%, #2a2a2a, #0c0c0c); border: 3px solid #e2ad3c; box-shadow: 0 0 0 2px #6d4507, 0 4px 10px rgba(0,0,0,.5); }
.perfil .avatar svg { width: 30px; height: 30px; color: #f3e6c8; }
.perfil-txt { display: grid; min-width: 0; line-height: 1.15; }
.perfil-txt b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.perfil-txt small { display: flex; align-items: center; gap: 5px; color: var(--oro); font-family: var(--display); font-size: 1rem; }
.estrella { display: inline-grid; width: 18px; height: 18px; color: var(--oro); vertical-align: -3px; }
.estrella svg { width: 100%; height: 100%; filter: drop-shadow(0 1px 0 #6d4507); }
.top-iconos { display: flex; gap: 10px; flex-shrink: 0; }
.icono-btn { appearance: none; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; cursor: pointer; color: #f0b73e;
  background: linear-gradient(180deg, #2a1d10, #120b05); border: 2.5px solid #d9a33c; box-shadow: inset 0 0 0 2px #3a2208, 0 5px 0 #0b0602, 0 8px 16px rgba(0,0,0,.4); }
.icono-btn:active { transform: translateY(3px); box-shadow: inset 0 0 0 2px #3a2208, 0 2px 0 #0b0602; }
.icono-btn svg { width: 25px; height: 25px; filter: drop-shadow(0 1px 0 #3a2208); }

/* logo con brillos */
.menu-logo { display: grid; place-items: center; position: relative; z-index: 1; margin: -4px 0 -6px; }
.menu-logo img { width: min(76vw, 330px); aspect-ratio: 1; object-fit: cover;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 62%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 62%, transparent 71%);
  filter: drop-shadow(0 16px 30px rgba(0,0,0,.55)); }
.logo-chispas { position: absolute; inset: 0; pointer-events: none; }
.logo-chispas i { position: absolute; left: var(--x); top: var(--y); width: 14px; height: 14px; opacity: 0; animation: chispa 2.4s var(--d) ease-in-out infinite;
  background: radial-gradient(circle, #fff 0 18%, transparent 20%), linear-gradient(transparent 46%, #ffe7a0 46% 54%, transparent 54%), linear-gradient(90deg, transparent 46%, #ffe7a0 46% 54%, transparent 54%);
  filter: drop-shadow(0 0 4px rgba(255,214,110,.9)); }

/* botones del menú: icono a la izquierda, separador, texto y el mismo icono en relieve a la derecha */
.menu-botones { display: grid; gap: 12px; padding: 0 clamp(10px, 6vw, 28px); position: relative; z-index: 2; }
.btn-menu { justify-content: flex-start; gap: 0; padding: 0; min-height: 58px; border-radius: 16px; overflow: hidden; font-size: 1.35rem; border-width: 3px; }
.btn-menu .menu-ico { width: 68px; align-self: stretch; display: grid; place-items: center; flex-shrink: 0; position: relative; }
.btn-menu .menu-ico::after { content: ""; position: absolute; right: 0; top: 10px; bottom: 10px; width: 2px; background: rgba(0,0,0,.28); box-shadow: 1px 0 0 rgba(255,255,255,.18); }
.btn-menu .menu-ico svg { width: 32px; height: 32px; }
.btn-menu .menu-txt { flex: 1; display: grid; text-align: left; padding: 0 8px 0 18px; min-width: 0; line-height: 1.05; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn-menu.rojo .menu-txt { font-size: clamp(1.1rem, 5.4vw, 1.35rem); }
.btn-menu .menu-txt small { font-family: var(--body); font-weight: 800; font-size: .8rem; opacity: .7; text-shadow: none; }
.btn-menu .menu-fantasma { width: 64px; display: grid; place-items: center; flex-shrink: 0; }
.btn-menu .menu-fantasma svg { width: 38px; height: 38px; }

.btn-menu.rojo { border-color: #3d0306; background: linear-gradient(180deg, #c42029 0%, #a3101b 50%, #780910 100%);
  box-shadow: inset 0 0 0 2px rgba(255,140,120,.35), inset 0 3px 0 rgba(255,180,170,.35), 0 6px 0 #3d0306, 0 12px 22px rgba(0,0,0,.45); }
.btn-menu.rojo .menu-ico { color: #f2bd45; }
.btn-menu.rojo .menu-ico svg { filter: drop-shadow(0 2px 0 #5a0a0a); }
.btn-menu.rojo .menu-txt { color: #fff3dc; text-shadow: 0 2px 0 #5a0408; }
.btn-menu.rojo .menu-fantasma { color: #8a0c16; }
.btn-menu.rojo .menu-fantasma svg { filter: drop-shadow(0 1px 0 rgba(255,120,110,.35)); }
.btn-menu.rojo:active { box-shadow: inset 0 0 0 2px rgba(255,140,120,.35), 0 2px 0 #3d0306, 0 6px 12px rgba(0,0,0,.45); }

.btn-menu.oro.mega { min-height: 80px; font-size: 2.3rem; border-color: #3a2203; border-width: 3.5px; border-radius: 22px;
  background: linear-gradient(180deg, #ffe28a 0%, #f8c94c 40%, #e9a92a 100%);
  box-shadow: inset 0 0 0 3px #f9d877, inset 0 -6px 0 rgba(160,95,0,.35), 0 7px 0 #3a2203, 0 16px 30px rgba(0,0,0,.5), 0 0 30px rgba(246,198,74,.25); }
.btn-menu.oro.mega .menu-ico { width: 88px; color: #241300; }
.btn-menu.oro.mega .menu-ico::after { display: none; }
.btn-menu.oro.mega .menu-ico svg { width: 46px; height: 46px; }
.btn-menu.oro.mega .menu-txt { text-align: center; padding: 0; color: #2b1700; text-shadow: 0 2px 0 rgba(255,240,190,.6); }
.btn-menu.oro.mega .menu-fantasma { width: 88px; color: #e2a224; }
.btn-menu.oro.mega .menu-fantasma svg { width: 58px; height: 46px; filter: drop-shadow(0 1px 0 rgba(255,240,190,.6)) drop-shadow(0 -1px 0 rgba(140,80,0,.4)); }
.btn-menu.oro.mega:active { box-shadow: inset 0 0 0 3px #f9d877, 0 2px 0 #3a2203, 0 6px 14px rgba(0,0,0,.5); }

/* cartas y coronas de fondo, como en el diseño */
.menu-decor { position: absolute; inset: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); pointer-events: none; z-index: 0; overflow: hidden; }
.menu-decor .decor { position: absolute; --w: 112px; opacity: .72; }
.menu-decor .decor .cara { box-shadow: 0 12px 30px rgba(0,0,0,.55); filter: sepia(.55) saturate(.8) brightness(.88); }
.menu-decor .d1 { left: -44px; top: 140px; transform: rotate(-16deg); }
.menu-decor .d2 { right: -58px; top: 240px; transform: rotate(-22deg); }
.menu-decor .d3 { left: -60px; bottom: 96px; transform: rotate(-22deg); }
.menu-decor .d4 { right: -62px; bottom: 80px; transform: rotate(24deg); }
.decor-corona { position: absolute; width: 60px; color: rgba(140,200,140,.12); }
.decor-corona.c1 { right: 20px; top: 140px; transform: rotate(12deg); }
.decor-corona.c2 { left: 14px; top: 46%; transform: rotate(-10deg); }

/* barra de abajo */
.tabbar { position: fixed; z-index: 15; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 560px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 10px max(8px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
  background: linear-gradient(180deg, #1e140b, #0c0804); border-top: 2.5px solid #c99a3a; border-radius: 30px 30px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,220,150,.12); }
.tab { appearance: none; background: none; border: 0; display: grid; justify-items: center; gap: 4px; padding: 4px 0; cursor: pointer; color: #8b7c68; font-family: var(--body); font-weight: 800; font-size: .86rem; }
.tab + .tab { border-left: 1px solid rgba(201,154,58,.22); }
.tab svg { width: 34px; height: 34px; }
.tab.activa { color: #f2b63a; }
.tab.activa svg { filter: drop-shadow(0 2px 0 #6d4507) drop-shadow(0 0 10px rgba(246,198,74,.35)); }

.creditos { text-align: center; color: var(--muted); font-size: .74rem; opacity: .8; }
.creditos a { color: inherit; }
.separador { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .85rem; }
.separador::before, .separador::after { content: ""; flex: 1; height: 2px; background: var(--borde-suave); }

/* ---- hojas del menú: tienda, estadísticas, ranking, recompensas ---- */
.hoja.ancha { max-width: 640px; }
.saldo { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 700; }
.saldo b { font-family: var(--display); font-weight: 400; font-size: 1.3rem; color: var(--oro); }
.tienda { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 16px 12px; }
.articulo { display: grid; justify-items: center; gap: 8px; padding: 12px 6px; border-radius: 18px; background: rgba(0,0,0,.28); border: 2px solid var(--borde-suave); text-align: center; }
.articulo.activo { border-color: var(--oro); box-shadow: 0 0 18px rgba(246,198,74,.3); }
.articulo .naipe { --w: 78px; }
.articulo b { font-family: var(--display); font-weight: 400; font-size: .98rem; }
.articulo .btn { min-height: 38px; font-size: .95rem; padding: 4px 12px; }
.articulo .btn .estrella { width: 16px; height: 16px; color: #6d4507; }
.precio.puesto { font-family: var(--display); color: var(--bien); min-height: 38px; display: grid; place-items: center; }
.datos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.dato { display: grid; gap: 2px; padding: 14px; border-radius: 18px; background: rgba(0,0,0,.28); border: 2px solid var(--borde-suave); }
.dato b { font-family: var(--display); font-weight: 400; font-size: 2rem; color: var(--oro); line-height: 1; }
.dato span { font-size: .86rem; color: var(--muted); font-weight: 800; }
.aviso-grande { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 18px; background: rgba(0,0,0,.28); border: 2px solid var(--borde-suave); }
.aviso-grande > span { width: 54px; flex-shrink: 0; color: var(--oro); }
.aviso-grande b { color: var(--oro); }
.ranking { display: grid; gap: 8px; }
.rk { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(0,0,0,.28); border: 2px solid var(--borde-suave); font-weight: 800; }
.rk .pos { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); background: rgba(255,255,255,.1); }
.rk.top1 .pos { background: radial-gradient(circle at 35% 30%, #fff1b0, var(--oro) 60%, var(--oro-hondo)); color: #2b1700; }
.rk.top2 .pos { background: radial-gradient(circle at 35% 30%, #fff, #c9c9c9 60%, #8a8a8a); color: #222; }
.rk.top3 .pos { background: radial-gradient(circle at 35% 30%, #ffd7b0, #cd7f32 60%, #7a4a1a); color: #2b1700; }
.rk .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rk .gan { color: var(--oro); font-size: .9rem; }
.diaria { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 14px; border-radius: 20px;
  background: linear-gradient(180deg, rgba(246,198,74,.22), rgba(246,198,74,.06)); border: 2px solid var(--oro); }
.diaria .regalo { width: 52px; height: 52px; color: var(--oro); }
.diaria b { font-family: var(--display); font-weight: 400; font-size: 1.15rem; }
.logros { display: grid; gap: 8px; }
.logro { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: rgba(0,0,0,.28); border: 2px solid var(--borde-suave); opacity: .8; }
.logro.ok { opacity: 1; border-color: var(--oro); }
.logro-ico { width: 32px; height: 32px; color: #8b7c68; }
.logro.ok .logro-ico { color: var(--oro); }
.logro b { font-family: var(--display); font-weight: 400; }
.logro .premio { font-family: var(--display); color: var(--oro); font-size: .95rem; white-space: nowrap; }

/* ---- hojas del menú ---- */
.codigo-input { text-transform: uppercase; letter-spacing: .4em; text-align: center; font-family: var(--display) !important; font-weight: 400 !important; font-size: 30px !important; min-height: 66px !important; }

/* ---- sala ---- */
.codigo-sala { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 14px; border-radius: 24px;
  background: linear-gradient(180deg, rgba(40,24,10,.92), rgba(16,9,3,.92)); border: 3px solid #c99a3a; box-shadow: 0 6px 0 #0d0703, 0 14px 30px rgba(0,0,0,.4); }
.codigo-sala .franja.arriba { display: none; }
.codigo-sala .letras { font-family: var(--display); font-size: 3.2rem; letter-spacing: .25em; padding-left: .25em; line-height: 1.05; color: var(--naipe); text-shadow: 0 3px 0 var(--oro-hondo), 0 5px 0 #2a1600, 0 10px 20px rgba(0,0,0,.6); }
.sala-lista { display: grid; gap: 8px; }
.sala-fila { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 18px; background: var(--panel); border: 2px solid var(--borde-suave); }
.sala-fila .asiento-n { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-size: 1.1rem; background: radial-gradient(circle at 35% 30%, #fff1b0, var(--oro) 60%, var(--oro-hondo)); color: #2b1700; border: 2px solid #8a5a0c; }
.sala-fila .nm { font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sala-fila .tu { color: var(--oro); font-weight: 800; font-size: .84rem; }
.sala-fila .ctrl { display: flex; gap: 5px; }
.sala-fila .ctrl button { appearance: none; width: 40px; height: 40px; border-radius: 12px; border: 2px solid var(--borde-suave); background: rgba(0,0,0,.3); color: var(--oro); cursor: pointer; font-family: var(--display); font-size: 1.1rem; }
.sala-fila .ctrl button:disabled { opacity: .3; }
.sala-fila.desconectado { opacity: .5; }
.nota { font-size: .9rem; font-weight: 700; color: var(--muted); padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,.25); border-left: 4px solid var(--oro); }
.puntos::after { content: ""; animation: puntos 1.4s steps(4) infinite; }
@keyframes puntos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.estado-turno { text-align: center; font-size: 1.1rem; font-weight: 800; }
.estado-turno b { color: var(--oro); font-family: var(--display); font-weight: 400; }
.mesa .naipe { --w: min(52vw, 210px, 26dvh); }
.mesa .naipe.toca { cursor: pointer; }
/* turno: carta grande con los botones encima */
#app:has(.screen.turno) { height: 100%; min-height: 0; box-sizing: border-box; }
.screen.turno { min-height: 0; }
.mesa-grande { flex: 1; min-height: 0; display: grid; place-items: center; container-type: size; }
.carta-marco { position: relative; --w: min(100cqw, 520px, calc(100cqh / 1.54)); width: var(--w); }
.carta-marco > .naipe { --w: inherit; z-index: 1; filter: drop-shadow(0 18px 30px rgba(0,0,0,.55)); }
.carta-marco > .naipe.toca { cursor: pointer; }
.sobre { position: absolute; left: 10px; right: 10px; z-index: 3; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.sobre.arriba { top: -16px; align-items: center; }
.sobre.abajo { bottom: -22px; left: 8px; right: 8px; }
.sobre button, .sobre .banner-cambio { pointer-events: auto; }
.sobre .leyenda { min-height: 0; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 8px; padding: 5px 14px; border-radius: 999px; background: rgba(4, 38, 13, .82); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border: 1.5px solid rgba(246,198,74,.85); box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.sobre .leyenda .carta-nombre { font-size: 1.05rem; }
.sobre .leyenda .orden:empty { display: none; }
.sobre .leyenda .orden { gap: 4px; }
.sobre .leyenda .sello { font-size: .68rem; padding: 2px 8px; }
.screen.turno .mesa-grande { padding-top: 18px; }
.hoja-cab .marca .logo-texto { display: none; }
.hoja-cab h2 { flex: 1; }
.rejilla { --cols: 4; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); container-type: inline-size; }
.asiento .naipe { --w: min(calc(100cqw / var(--cols) - 18px), 150px); }
.sobre .banner-cambio { width: 100%; }
.sobre .acciones { margin: 0; gap: 8px; }
.botonera { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.botonera.tres { grid-template-columns: 1fr 1fr 1fr; }
.botonera .btn { min-height: 48px; padding: 6px 10px; font-size: .95rem; line-height: 1.1; gap: 6px; box-shadow: 0 4px 0 rgba(0,0,0,.45), 0 10px 22px rgba(0,0,0,.45); }
.botonera .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.botonera .lbl { display: flex; flex-direction: column; align-items: flex-start; }
.botonera .lbl small { font-size: .72rem; opacity: .85; font-weight: 800; }
.screen.turno .estado-turno { margin: -4px 0 -6px; font-size: 1rem; }
.screen.turno .mesa-grande { padding-bottom: 26px; }
.duo .btn { font-size: 1.05rem; padding-inline: 12px; }
.pista { text-align: center; font-size: .8rem; font-weight: 700; color: var(--muted); }
.banner-cambio.mio { background: linear-gradient(180deg, var(--oro-claro), var(--oro)); color: #2b1700; border-color: #8a5a0c; box-shadow: 0 5px 0 var(--oro-sombra), 0 12px 24px rgba(0,0,0,.4); }
.banner-cambio.mio svg { color: #6d4507; }
.banner-cambio.mio strong { color: var(--rojo); }
.espectador { text-align: center; padding: 30px 0; display: grid; gap: 10px; justify-items: center; }
.anfitrion-extra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.conexion { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 30; background: linear-gradient(180deg, var(--rojo-claro), var(--rojo)); border: 2px solid var(--oro); color: #fff; padding: 7px 15px; border-radius: 999px; font-size: .85rem; font-weight: 800; }
.turno-ficha.off { opacity: .45; }
.banderas { display: flex; align-items: center; justify-content: center; gap: 12px; }
.final .banderas .bandera { width: 54px; }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">La Rata necesita JavaScript activado.</p></noscript>
<script>
(() => {
  'use strict';

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const KEY_NAME = 'larata-nombre';
  const KEY_SESSION = 'larata-sesion';

/*CARDS_JS*/

  const SUIT_CODE = { o: 'oros', c: 'copas', e: 'espadas', b: 'bastos' };
  const dec = (s) => (s ? { rank: parseInt(s, 10), suit: SUIT_CODE[s.slice(-1)] } : null);
  const cardName = (c) => `${RANK_NAME[c.rank] || c.rank} de ${c.suit}`;

  // ---------- utilidades ----------
  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'html') n.innerHTML = v; // solo SVG fijos de este archivo
        else if (k === 'tap') onTap(n, v);
        else if (k === 'style') n.style.cssText = v;
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      n.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
    }
    return n;
  }
  /** Toque fiable en Android: dispara al levantar el dedo y no repite con el clic. */
  function onTap(el, fn) {
    let last = 0;
    el.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (el.disabled) return;
      last = Date.now(); fn(e);
    });
    el.addEventListener('click', (e) => { if (Date.now() - last < 700 || el.disabled) return; fn(e); });
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));
  function anim(el, frames, opts) {
    if (!el || !el.animate || reduceMotion) return Promise.resolve();
    return el.animate(frames, Object.assign({ duration: 400, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }, opts)).finished.catch(() => {});
  }
  function vibrate(p) {
    try { if (localStorage.getItem('larata-vibrar') === 'false') return; navigator.vibrate && navigator.vibrate(p); } catch (_) { /* sin vibración */ }
  }
  function toast(text) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = h('div', { class: 'toast', role: 'status' }, text);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* sin almacenamiento */ } },
    del(k) { try { localStorage.removeItem(k); } catch (_) { /* sin almacenamiento */ } },
  };

  function cardTags(card) {
    const tags = [];
    if (card.suit === 'bastos' && card.rank === 1) tags.push(h('span', { class: 'sello malo' }, 'As de bastos: quita 2 vidas'));
    if (card.suit === 'bastos' && card.rank === 12) tags.push(h('span', { class: 'sello bueno' }, 'Rey de bastos: +1 vida (sin pelle)'));
    return tags;
  }

  // =====================================================================
  //  CONEXIÓN CON EL SERVIDOR
  // =====================================================================
  let ws = null;
  let connected = false;
  let everConnected = false;
  let retryMs = 800;
  let session = store.get(KEY_SESSION); // { code, token, playerId }
  let resuming = false;
  let snap = null;
  let myName = store.get(KEY_NAME) || '';
  let pending = null; // acción enviada esperando respuesta

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try { ws = new WebSocket(`${proto}://${location.host}/api/ws`); /* en Render y en Vercel */ } catch (_) { scheduleReconnect(); return; }
    ws.onopen = () => {
      connected = true; everConnected = true; retryMs = 800;
      if (session) { resuming = true; send({ type: 'resume', code: session.code, token: session.token }); }
      render();
    };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } onMessage(m); };
    ws.onclose = () => { connected = false; renderConnection(); scheduleReconnect(); };
    ws.onerror = () => {};
  }
  function scheduleReconnect() {
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 1.7, 8000);
  }
  // Al volver a la app (móvil bloqueado, cambio de app), reconecta enseguida.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ws && ws.readyState > 1) { retryMs = 400; connect(); }
  });

  function send(msg) {
    if (!ws || ws.readyState !== 1) {
      toast(window.LARATA_DEMO ? 'Esto es una vista de ejemplo: para jugar en línea hace falta el servidor.' : 'Sin conexión con el servidor. Reintentando…');
      return false;
    }
    ws.send(JSON.stringify(msg));
    return true;
  }
  function act(type, extra) {
    if (pending) return;
    if (!send(Object.assign({ type }, extra || {}))) return;
    pending = type;
    render();
    setTimeout(() => { if (pending === type) { pending = null; render(); } }, 6000);
  }

  function onMessage(m) {
    if (m.type === 'joined') {
      resuming = false;
      session = { code: m.code, token: m.token, playerId: m.playerId };
      store.set(KEY_SESSION, session);
      history.replaceState(null, '', `/?sala=${m.code}`);
      return;
    }
    if (m.type === 'state') { pending = null; receive(m.snap); return; }
    if (m.type === 'kicked') { leaveRoom(); toast('La mesa te ha sacado de la sala.'); return; }
    if (m.type === 'error') {
      pending = null;
      if (resuming) { resuming = false; leaveRoom(); toast('Esa partida ya no existe. Entra en una sala nueva.'); return; }
      toast(m.message);
      render();
    }
  }

  function leaveRoom() {
    session = null; snap = null; store.del(KEY_SESSION);
    history.replaceState(null, '', '/');
    resetAnimState();
    render();
  }

  // =====================================================================
  //  ESTADO Y ANIMACIONES
  // =====================================================================
  let shownCard = null;
  let banner = null;
  let cardHidden = false;
  let animating = false;
  let queued = false;
  let showWinner = false;
  let overTimer = null;
  let sheet = null;
  let lastTurnBuzz = '';

  function resetAnimState() { shownCard = null; banner = null; cardHidden = false; showWinner = false; clearTimeout(overTimer); overTimer = null; sheet = null; }

  const me = () => (snap ? snap.me : null);
  const isHost = () => !!snap && snap.host === snap.me;
  const P = (pid) => (snap && snap.pl ? snap.pl.find((x) => x.p === pid) : null);
  const nameOf = (pid) => {
    const p = P(pid) || (snap && snap.lobby ? snap.lobby.find((x) => x.p === pid) : null);
    return p ? p.n : '—';
  };
  const myCard = (s) => (s && s.c && s.c[s.me] ? dec(s.c[s.me]) : null);

  function receive(b) {
    if (!b || typeof b !== 'object') return;
    const a = snap;
    if (a && a.sid === b.sid && b.v < a.v) return;
    snap = b;
    try { contarProgreso(b); } catch (_) { /* las estadísticas no deben romper la partida */ }
    if (b.k !== 'juego' || b.ph !== 'over') { showWinner = false; clearTimeout(overTimer); overTimer = null; }
    if (b.k !== 'juego') { banner = null; shownCard = null; render(); return; }

    const sameRound = a && a.k === 'juego' && a.sid === b.sid && a.r === b.r;
    const newActs = sameRound ? b.ac.slice(a.ac.length) : [];
    let effect = null;
    if (!sameRound && b.ph === 'turns') { effect = 'reparto'; banner = null; cardHidden = false; }
    for (const [type, pid, other] of newActs) {
      if (type === 'swap' && pid === b.me) { effect = 'cambio-mio'; banner = { kind: 'cambiado', other }; }
      else if (type === 'swap' && other === b.me) { effect = 'cambio-recibido'; banner = { kind: 'recibido', other: pid }; }
      else if (type === 'draw' && pid === b.me) { effect = 'levanto'; banner = { kind: 'levantado' }; }
    }
    if (b.ph !== 'turns') banner = null;
    const oldCard = shownCard;
    const newCard = myCard(b);
    shownCard = newCard;
    const revealAnim = b.ph !== 'turns' && (!a || a.k !== 'juego' || a.ph === 'turns' || a.r !== b.r || a.sid !== b.sid);
    render({ effect: effect && newCard ? effect : null, oldCard, revealAnim });
  }

  // =====================================================================
  //  PANTALLAS
  // =====================================================================
  const app = document.getElementById('app');

  function render(fx = {}) {
    if (animating) { queued = true; return; }
    const focused = document.activeElement && document.activeElement.id;
    const sel = focused && document.activeElement.selectionStart;
    app.replaceChildren(pickScreen()(fx));
    if (focused) {
      const el = document.getElementById(focused);
      if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (_) { /* no es texto */ } }
    }
    renderSheet();
    renderConnection();
  }

  function pickScreen() {
    // El menú se ve aunque todavía no haya conexión; solo se espera si hay una partida que recuperar.
    if (!snap) return session && (resuming || !everConnected) && !window.LARATA_DEMO ? screenConnecting : screenHome;
    if (snap.k === 'sala') return screenLobby;
    if (snap.ph === 'turns') return screenTurns;
    if (snap.ph === 'reveal') return (fx) => revealScreen(fx, false);
    return screenOver;
  }

  function cabecera(extra) {
    return h('header', { class: 'cabecera' },
      botonLogo(),
      h('span', { class: 'ronda' }, extra || ''),
      snap && snap.k === 'juego' ? h('button', { class: 'btn chico', tap: () => { sheet = 'marcador'; renderSheet(); } }, 'Marcador')
        : snap ? h('button', { class: 'btn chico fantasma', tap: () => { sheet = 'salir'; renderSheet(); } }, 'Salir') : null);
  }

  function irInicio() {
    if (snap) { sheet = 'salir'; renderSheet(); return; }
    if (session) { resuming = false; send({ type: 'leave' }); leaveRoom(); }
    sheet = null; afterName = null; render();
  }
  const botonLogo = () => h('button', { class: 'marca', html: RAT_SMALL, 'aria-label': 'Volver al inicio', tap: irInicio });

  function screenConnecting() {
    return h('section', { class: 'screen' }, h('div', { class: 'pasa' },
      h('div', { class: 'abanico', 'aria-hidden': 'true' }, naipe(null), naipe(null), naipe(null)),
      h('h1', { class: 'titulo' }, 'La Rata'),
      h('p', { class: 'muted puntos' }, session ? 'Volviendo a tu partida' : 'Conectando')));
  }

  function nameField() {
    const input = h('input', { id: 'mi-nombre', type: 'text', maxlength: '20', autocomplete: 'nickname', enterkeyhint: 'done', placeholder: 'Tu nombre', 'aria-label': 'Tu nombre' });
    input.value = myName;
    input.addEventListener('input', () => { myName = input.value.slice(0, 20); store.set(KEY_NAME, myName); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
    return h('div', { class: 'campo campo-solo' }, input);
  }
  // =====================================================================
  //  PERFIL LOCAL: estrellas, dorsos, estadísticas, rivales y logros (se guarda en este móvil)
  // =====================================================================
  const KEY_PERFIL = 'larata-perfil';
  const hoy = () => new Date().toISOString().slice(0, 10);
  const perfil = Object.assign({
    estrellas: 150, dorso: 'borgona', comprados: ['borgona'],
    stats: { partidas: 0, ganadas: 0, rondas: 0, masBaja: 0, vidasPerdidas: 0, cambios: 0 },
    rivales: {}, recompensa: null, racha: 0, logros: [], vistos: [],
  }, store.get(KEY_PERFIL) || {});
  if (!myName) { myName = `Jugador${100 + Math.floor(Math.random() * 900)}`; store.set(KEY_NAME, myName); }
  const guardarPerfil = () => store.set(KEY_PERFIL, perfil);
  guardarPerfil();

  const LOGROS = [
    { id: 'primera', nombre: 'Primera partida', desc: 'Juega una partida completa', premio: 50, ok: () => perfil.stats.partidas >= 1 },
    { id: 'victoria', nombre: 'La rata más lista', desc: 'Gana tu primera partida', premio: 100, ok: () => perfil.stats.ganadas >= 1 },
    { id: 'diez', nombre: 'Habitual del bar', desc: 'Juega 10 partidas', premio: 150, ok: () => perfil.stats.partidas >= 10 },
    { id: 'cambiador', nombre: 'Trilero', desc: 'Cambia la carta 20 veces', premio: 80, ok: () => perfil.stats.cambios >= 20 },
    { id: 'cinco', nombre: 'Racha de oro', desc: 'Gana 5 partidas', premio: 200, ok: () => perfil.stats.ganadas >= 5 },
  ];
  function premiar(n, motivo) {
    perfil.estrellas += n;
    guardarPerfil();
    toast(`+${n} ★ · ${motivo}`);
  }
  function revisarLogros() {
    for (const l of LOGROS) if (!perfil.logros.includes(l.id) && l.ok()) { perfil.logros.push(l.id); premiar(l.premio, `Logro: ${l.nombre}`); }
  }
  /** Una sola vez por suceso (aunque llegue repetido al reconectar). */
  function primeraVez(clave) {
    if (perfil.vistos.includes(clave)) return false;
    perfil.vistos.push(clave);
    perfil.vistos = perfil.vistos.slice(-40);
    return true;
  }
  /** Se llama con cada estado nuevo: cuenta rondas, cambios y partidas para estadísticas y estrellas. */
  function contarProgreso(b) {
    if (!b || b.k !== 'juego') return;
    for (const [type, pid] of b.ac || []) if (type === 'swap' && pid === b.me && primeraVez(`${b.sid}:${b.r}:cambio`)) perfil.stats.cambios += 1;
    if (b.ph !== 'turns' && b.res && b.res.rv.some(([pid]) => pid === b.me) && primeraVez(`${b.sid}:${b.r}:ronda`)) {
      perfil.stats.rondas += 1;
      const d = b.res.la[b.me] - b.res.lb[b.me];
      if (b.res.lo.includes(b.me)) perfil.stats.masBaja += 1;
      if (d < 0) perfil.stats.vidasPerdidas += -d;
      else perfil.estrellas += 5;
    }
    if (b.ph === 'over' && b.pl.some((p) => p.p === b.me) && primeraVez(`${b.sid}:fin`)) {
      perfil.stats.partidas += 1;
      const gano = b.win === b.me;
      if (gano) perfil.stats.ganadas += 1;
      for (const p of b.pl) {
        if (p.p === b.me) continue;
        const r = perfil.rivales[p.n] || { partidas: 0, ganadas: 0, perdidas: 0 };
        r.partidas += 1;
        if (gano) r.ganadas += 1; else if (b.win === p.p) r.perdidas += 1;
        perfil.rivales[p.n] = r;
      }
      guardarPerfil();
      premiar(gano ? 50 : 10, gano ? 'Has ganado la partida' : 'Partida jugada');
      revisarLogros();
    }
    guardarPerfil();
  }

  let afterName = null;
  function needName(then) {
    myName = (myName || '').replace(/\s+/g, ' ').trim();
    store.set(KEY_NAME, myName);
    if (!myName) { afterName = then || null; sheet = 'perfil'; renderSheet(); return true; }
    return false;
  }

  // --- instalar la app ---
  let installEvent = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvent = e; render(); });
  window.addEventListener('appinstalled', () => { installEvent = null; toast('App instalada. Ya la tienes en la pantalla de inicio.'); render(); });
  const standalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
  async function installNow() { const e = installEvent; installEvent = null; try { await e.prompt(); } catch (_) { /* cancelado */ } render(); }

  // --- intro con el logo ---
  let introOn = true;
  function showIntro() {
    const ases = ['espadas', 'copas', 'bastos', 'oros'].map((suit) => naipe({ rank: 1, suit }, { up: true }));
    const intro = h('div', { class: 'intro', role: 'button', 'aria-label': 'Entrar en La Rata' },
      h('div', { class: 'intro-rayos', 'aria-hidden': 'true' }),
      h('img', { class: 'intro-logo', src: logoSrc(), alt: 'La Rata' }),
      h('div', { class: 'intro-cartas', 'aria-hidden': 'true' }, ases),
      h('div', { class: 'intro-chispas', 'aria-hidden': 'true' }, Array.from({ length: 14 }, (_, i) => h('i', { style: `--x:${(i * 37) % 100}%;--y:${(i * 53) % 100}%;--d:${(i % 7) * 0.25}s` }))),
      h('p', { class: 'intro-toca' }, 'Toca para empezar'));
    let done = false;
    const salir = () => {
      if (done) return;
      done = true;
      intro.classList.add('sale');
      setTimeout(() => { intro.remove(); introOn = false; render(); }, 480);
    };
    onTap(intro, salir);
    setTimeout(salir, reduceMotion ? 600 : 3600);
    document.body.appendChild(intro);
  }

  // --- menú principal (igual que el diseño de referencia) ---
  function menuBtn(cls, icon, label, action, right) {
    return h('button', { class: `btn btn-menu ${cls}`, tap: action },
      h('span', { class: 'menu-ico', html: ICON[icon] }),
      h('span', { class: 'menu-txt' }, label),
      h('span', { class: 'menu-fantasma', html: ICON[right] }));
  }
  const abrir = (nombre) => () => { sheet = nombre; renderSheet(); };

  function irUnaPantalla() {
    if (window.LARATA_DEMO) { toast('En la app publicada se abre el modo de un solo móvil.'); return; }
    location.href = '/una-pantalla.html';
  }

  function fromLink() {
    return (new URLSearchParams(location.search).get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
  }
  function joinCode(c) {
    if (needName(() => joinCode(c))) return;
    if (c.length !== 5) { toast('El código tiene 5 letras.'); return; }
    sheet = null; renderSheet();
    act('join', { code: c, name: myName });
  }
  function createRoom(lives) {
    if (needName(() => createRoom(lives))) return;
    sheet = null; renderSheet();
    act('create', { name: myName, config: { lives: lives || 2 } });
  }

  function screenHome() {
    const invited = fromLink();
    const perfilBtn = h('button', { class: 'perfil', tap: abrir('perfil') },
      h('span', { class: 'avatar', html: ICON.persona }),
      h('span', { class: 'perfil-txt' }, h('b', null, myName), h('small', null, h('span', { class: 'estrella', html: ICON.estrella }), String(perfil.estrellas))));
    const top = h('div', { class: 'menu-top' }, perfilBtn,
      h('div', { class: 'top-iconos' },
        h('button', { class: 'icono-btn', 'aria-label': 'Ajustes', tap: abrir('perfil') }, h('span', { html: ICON.ajustes })),
        h('button', { class: 'icono-btn', 'aria-label': 'Estadísticas', tap: abrir('estadisticas') }, h('span', { html: ICON.barras }))));

    const botones = h('div', { class: 'menu-botones' },
      menuBtn('oro mega', 'jugar', 'Jugar', invited ? () => joinCode(invited) : abrir('unirse'), 'corona'),
      menuBtn('rojo', 'grupo', 'Crear partida', () => createRoom(2), 'mundo'),
      menuBtn('rojo', 'trofeo', 'Torneos', abrir('torneos'), 'laurel'),

  function animateCard(fx, carta, card, fill, toggle) {
    animating = true;
    requestAnimationFrame(async () => {
      let el = carta;
      if (fx.effect === 'reparto') {
        await anim(el, [{ transform: 'translateY(-60%) rotate(-8deg) scale(.8)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 520 });
      } else {
        const right = fx.effect === 'cambio-mio';
        const draw = fx.effect === 'levanto';
        const out = draw ? 'translateY(60%) scale(.8)' : `translateX(${right ? 140 : -140}%) rotate(${right ? 14 : -14}deg)`;
        const from = draw ? 'translateY(-90%) rotate(-6deg) scale(.8)' : `translateX(${right ? 140 : -140}%) rotate(${right ? 14 : -14}deg)`;
        vibrate(fx.effect === 'cambio-recibido' ? [50, 70, 50] : 30);
        if (el.classList.contains('boca-arriba')) { el.classList.remove('boca-arriba'); await wait(560); }
        await anim(el, [{ transform: 'none', opacity: 1 }, { transform: out, opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.8,.4)' });
        const nueva = naipe(card, { up: false, cls: 'toca' });
        toggle(nueva);
        el.replaceWith(nueva); el = nueva;
        await anim(el, [{ transform: from, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 560 });
      }
      cardHidden = false;
      el.classList.add('boca-arriba');
      await wait(620);
      if (fx.effect !== 'reparto') el.classList.add('brilla');
      fill(card);
      animating = false;
      if (queued) { queued = false; render(); }
    });
  }

  function summary(res) {
    const who = res.lo.map((pid) => (pid === snap.me ? 'Tú' : nameOf(pid))).join(' y ');
    const verb = res.lo.length > 1 ? 'Pierden' : (res.lo[0] === snap.me ? 'Pierdes' : 'Pierde');
    const base = res.lo[0] === snap.me && res.lo.length === 1 ? `Pierdes: tienes la carta más baja` : `${verb} ${who}: ${res.lo.length > 1 ? 'empatan con' : 'tiene'} la carta más baja`;
    return res.tb ? `${base}. Los últimos caen a la vez: siguen con 1 vida y repiten ronda.` : base;
  }

  function cronica(res) {
    const b = (pid) => h('b', null, pid === snap.me ? 'Tú' : nameOf(pid));
    const lines = res.ac.map(([t, pid, other]) => (t === 'keep' ? [b(pid), ' se quedó su carta']
      : t === 'swap' ? [b(pid), ' cambió con ', b(other)]
        : [b(pid), ' levantó baraja']));
    for (const [pid, label, lives, blocked] of res.ef) {
      lines.push(blocked ? [b(pid), ` tenía el ${label}, pero con el pelle no suma vida`]
        : lives < 0 ? [b(pid), ` · ${label}: −${-lives} vidas en total`] : [b(pid), ` · ${label}: +${lives} vida`]);
    }
    if (res.el.length) lines.push([h('b', null, res.el.map(nameOf).join(', ')), ' queda fuera']);
    return lines.length ? h('div', { class: 'cronica' }, lines.map((l) => h('p', null, l))) : null;
  }

  function revealScreen(fx, over) {
    const res = snap.res;
    if (!res) return h('section', { class: 'screen' }, cabecera(''), h('p', { class: 'estado-turno puntos' }, 'Revelando'));
    const animate = !!fx.revealAnim;
    const rejilla = h('div', { class: 'rejilla', style: `--cols:${Math.min(Math.max(res.rv.length, 2), 4)}` });
    const items = [];
    for (const [pid, code] of res.rv) {
      const card = dec(code);
      const d = res.la[pid] - res.lb[pid];
      const loses = res.lo.includes(pid);
      const n = naipe(card, { up: !animate, cls: animate ? '' : (loses ? 'pierde' : 'salva') });
      const deltaTxt = d === 0 ? `♥${res.la[pid]}` : `${d > 0 ? '+' : ''}${d} · ♥${Math.max(0, res.la[pid])}`;
      const delta = h('span', { class: `delta ${d < 0 ? 'menos' : d > 0 ? 'mas' : ''}` }, animate ? '' : deltaTxt);
      const marca = loses ? h('span', { class: 'marca-pierde', style: animate ? 'opacity:0' : '' }, 'LA MÁS BAJA') : null;
      rejilla.appendChild(h('div', { class: 'asiento' }, marca, n, h('span', { class: 'nm' }, pid === snap.me ? 'Tú' : nameOf(pid)), delta, res.el.includes(pid) ? h('span', { class: 'fuera' }, 'FUERA') : null));
      items.push({ n, delta, deltaTxt, loses, marca });
    }
    const resumen = h('p', { class: 'muted', style: animate ? 'visibility:hidden' : '' }, summary(res));
    const acciones = h('div', { class: 'acciones' });
    if (isHost()) {
      acciones.append(over
        ? h('button', { class: 'btn oro', tap: () => { showWinner = true; render(); } }, 'Ver quién gana')
        : h('button', { class: 'btn oro', disabled: pending ? true : null, tap: () => act('next') }, 'Siguiente ronda'));
    } else {
      acciones.append(h('p', { class: 'estado-turno puntos' }, over ? 'Fin de la partida' : `Esperando a que ${nameOf(snap.host)} reparta`));
    }
    const screen = h('section', { class: 'screen' },
      cabecera(`Ronda ${res.r}`),
      h('div', { class: 'resultado' }, h('span', { class: 'eyebrow' }, res.tb ? 'DESEMPATE' : `RONDA ${res.r}`), h('h2', null, 'Cartas boca arriba'), resumen),
      rejilla, cronica(res), acciones);
    if (animate) {
      animating = true;
      requestAnimationFrame(async () => {
        await wait(350);
        for (const x of items) { x.n.classList.add('boca-arriba'); await wait(260); }
        await wait(500);
        for (const x of items) {
          if (x.loses) { x.n.classList.add('pierde'); if (x.marca) { x.marca.style.opacity = ''; x.marca.classList.add('flota'); } } else x.n.classList.add('salva');
          x.delta.textContent = x.deltaTxt; x.delta.classList.add('flota');
        }
        resumen.style.visibility = '';
        vibrate(60);
        animating = false;
        if (queued) { queued = false; render(); }
      });
    }
    return screen;
  }

  function screenOver(fx) {
    if (!showWinner) {
      if (!isHost() && !overTimer) overTimer = setTimeout(() => { overTimer = null; if (snap && snap.ph === 'over') { showWinner = true; render(); } }, 6000);
      return revealScreen(fx, true);
    }
    const winner = snap.win ? P(snap.win) : null;
    const ranking = snap.pl.slice().sort((a, b) => b.l - a.l || Number(b.a) - Number(a.a));
    const screen = h('section', { class: 'screen' },
      cabecera(`Ronda ${snap.r}`),
      h('div', { class: 'final' },
        h('div', { class: 'banderas' }, h('span', { class: 'bandera', html: FLAG_ESPANA }), h('span', { class: 'corona-grande', html: CROWN }), h('span', { class: 'bandera', html: FLAG_BORGONA })),
        h('span', { class: 'eyebrow' }, winner ? 'GANA LA PARTIDA' : 'NADIE SIGUE VIVO'),
        h('h2', { class: 'ganador' }, winner ? (winner.p === snap.me ? '¡Has ganado!' : winner.n) : 'Sin ganador')),
      h('div', { class: 'clasif' }, ranking.map((p) => h('div', { class: `fila ${p.p === snap.win ? 'primero' : ''}` }, h('span', null, p.n), h('span', { class: 'muted' }, p.a ? `♥${p.l}` : 'fuera')))),
      h('div', { class: 'acciones' }, isHost()
        ? [h('button', { class: 'btn oro', tap: () => act('rematch') }, 'Revancha con los mismos'),
          h('button', { class: 'btn fantasma', tap: () => act('lobby') }, 'Volver a la sala (entra o sale gente)')]
        : h('p', { class: 'estado-turno puntos' }, `Esperando a que ${nameOf(snap.host)} empiece otra`)));
    if (winner && !reduceMotion) {
      const c = h('div', { class: 'confeti', 'aria-hidden': 'true' });
      const colors = ['#c8102e', '#f1bf00', '#c8102e', '#f1bf00', '#ffffff'];
      for (let i = 0; i < 60; i++) c.appendChild(h('i', { style: `left:${Math.random() * 100}%;background:${colors[i % 5]};animation-duration:${2.2 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s` }));
      screen.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
    return screen;
  }

  // ---------- marcador y salir ----------
  function renderSheet() {
    document.querySelectorAll('.velo').forEach((v) => v.remove());
    if (!sheet) return;
    if (!snap) { renderMenuSheet(); return; }
    const cerrar = () => { sheet = null; renderSheet(); };
    if (sheet === 'salir') {
      document.body.appendChild(h('div', { class: 'velo centro' }, h('div', { class: 'dialogo', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Salir de la sala' },
        h('h3', null, '¿Volver al inicio?'),
        h('p', { class: 'muted' }, snap.k === 'juego' ? 'La partida sigue sin ti; tu turno lo puede pasar quien lleva la mesa.' : 'Dejarás tu sitio en la mesa.'),
        h('div', { class: 'duo' }, h('button', { class: 'btn', tap: cerrar }, 'Quedarme'),
          h('button', { class: 'btn rojo', tap: () => { send({ type: 'leave' }); leaveRoom(); } }, 'Salir al inicio')))));
      return;
    }
    if (snap.k !== 'juego') { sheet = null; return; }
    const host = isHost();
    const jugadores = h('div', { class: 'jugadores' }, snap.pl.map((p) => h('div', { class: `jug ${p.a ? '' : 'fuera'}` },
      h('span', { class: 'nm' }, p.p === snap.me ? `${p.n} (tú)` : p.n),
      h('span', { class: 'vidas' }, p.a ? `♥ ${p.l}` : 'fuera'),
      host ? h('button', { class: 'toggle', 'aria-pressed': String(!!p.pe), tap: () => send({ type: 'pelle', target: p.p }) }, p.pe ? 'Tiene pelle' : 'Dar pelle')
        : h('span', { class: 'muted small' }, p.pe ? 'pelle' : ''))));
    const historia = h('div', { class: 'historia' });
    (snap.hi || []).slice().reverse().forEach((e) => {
      historia.appendChild(h('div', { class: 'ent' }, h('h3', null, `Ronda ${e.r}`),
        h('p', null, e.rv.map(([pid, code]) => `${nameOf(pid)}: ${cardName(dec(code))}`).join(' · ')),
        h('p', { class: 'muted' }, `Pierde${e.lo.length > 1 ? 'n' : ''} ${e.lo.map(nameOf).join(' y ')} con la carta más baja${e.tb ? ' (desempate)' : ''}`),
        h('p', { class: 'muted small' }, Object.entries(e.la).map(([pid, l]) => `${nameOf(pid)} ♥${Math.max(0, l)}`).join(' · '))));
    });
    if (!(snap.hi || []).length) historia.appendChild(h('p', { class: 'muted small' }, 'Aún no ha terminado ninguna ronda.'));
    const velo = h('div', { class: 'velo' }, h('div', { class: 'hoja', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Marcador' },
      h('div', { class: 'hoja-cab' }, h('button', { class: 'marca', html: RAT_SMALL, 'aria-label': 'Volver', tap: cerrar }), h('h2', null, 'Marcador'), h('button', { class: 'btn chico', tap: cerrar }, 'Cerrar')),
      h('p', { class: 'muted small' }, `Sala ${snap.code}. ${host ? 'Quien tiene el pelle no recupera vida con el Rey de bastos.' : 'El pelle lo da quien lleva la mesa. Con pelle no se recupera vida con el Rey de bastos.'}`),
      jugadores, h('span', { class: 'etiqueta' }, 'RONDAS'), historia,
      h('button', { class: 'btn fantasma', tap: () => { sheet = 'salir'; renderSheet(); } }, 'Salir de la sala')));
    velo.addEventListener('click', (e) => { if (e.target === velo) cerrar(); });
    document.body.appendChild(velo);
  }

  function renderConnection() {
    document.querySelectorAll('.conexion').forEach((n) => n.remove());
    if (everConnected && !connected) document.body.appendChild(h('div', { class: 'conexion', role: 'status' }, 'Reconectando…'));
  }

  // ---------- arranque ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/sw.js').catch(() => { /* la app funciona igual sin él */ });
  }
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (_) { /* sin bloqueo de pantalla */ }
  showIntro();
  render();
  if (!window.LARATA_DEMO) connect();
  setTimeout(preloadCards, 1500);
})();
</script>
</body>
</html>
