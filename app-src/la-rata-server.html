<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Rata</title>
<meta name="description" content="Juego de cartas La Rata: cada uno en su móvil y con su carta.">
<meta name="theme-color" content="#0b2e22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Rata">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icono-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/*BASE_CSS*/

/* ---------- app con servidor ---------- */
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.campo-solo input { padding-left: 16px; }
.banderas { display: flex; align-items: center; justify-content: center; gap: 12px; }
.banderas .muted { font-size: .95rem; }
.final .banderas .bandera { width: 54px; }
.unirse { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.unirse input { width: 100%; min-width: 0; min-height: 54px; font: inherit; color: var(--fg); background: rgba(0, 0, 0, .35); border: 1px solid var(--borde); border-radius: 14px; padding: 10px 12px; }
.unirse input:focus { outline: none; border-color: var(--gualda); box-shadow: 0 0 0 3px rgba(241,191,0,.2); }
.codigo-input { text-transform: uppercase; letter-spacing: .35em; text-align: center; font-family: var(--display) !important; font-weight: 900 !important; font-size: 22px !important; }
.separador { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: .85rem; }
.separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: var(--borde); }
.codigo-sala { position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 20px 14px 16px; border-radius: 22px; background: var(--panel); border: 1px solid var(--borde); backdrop-filter: blur(14px); }
.codigo-sala .franja.arriba { position: absolute; left: 0; right: 0; top: 0; border-radius: 0; }
.codigo-sala .letras { font-family: var(--display); font-weight: 900; font-stretch: 80%; font-size: 3rem; letter-spacing: .28em; padding-left: .28em; line-height: 1.1; color: #fff; text-shadow: 0 3px 0 var(--rojo-hondo); }
.sala-lista { display: grid; gap: 8px; }
.sala-fila { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 16px; background: var(--panel); border: 1px solid var(--borde); }
.sala-fila .asiento-n { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 900; background: linear-gradient(180deg, #ffd84d, var(--gualda)); color: #2a1b00; }
.sala-fila .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.sala-fila .tu { color: var(--gualda); font-weight: 600; font-size: .84rem; }
.sala-fila .ctrl { display: flex; gap: 4px; }
.sala-fila .ctrl button { appearance: none; width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--panel-fuerte); cursor: pointer; font-weight: 800; }
.sala-fila .ctrl button:disabled { opacity: .3; }
.sala-fila.desconectado { opacity: .5; }
.nota { font-size: .9rem; color: var(--muted); border-left: 4px solid; border-image: linear-gradient(180deg, var(--rojo), var(--gualda), var(--rojo)) 1; padding-left: 12px; }
.puntos::after { content: ""; animation: puntos 1.4s steps(4) infinite; }
@keyframes puntos { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
.estado-turno { text-align: center; font-size: 1.05rem; }
.estado-turno b { color: var(--gualda); }
.mesa .naipe { --w: min(52vw, 210px, 26dvh); }
.mesa .naipe.toca { cursor: pointer; }
.pista { text-align: center; font-size: .8rem; color: var(--muted); }
.banner-cambio.mio { background: linear-gradient(100deg, rgba(241,191,0,.32), rgba(241,191,0,.08)); border-color: rgba(241,191,0,.5); }
.espectador { text-align: center; padding: 30px 0; display: grid; gap: 10px; justify-items: center; }
.anfitrion-extra { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.conexion { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); z-index: 30; background: rgba(200,16,46,.95); color: #fff; padding: 7px 15px; border-radius: 999px; font-size: .85rem; font-weight: 600; }
.instalar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; background: linear-gradient(100deg, rgba(241,191,0,.16), rgba(200,16,46,.12)); border: 1px solid rgba(241,191,0,.4); }
.instalar p { flex: 1; font-size: .92rem; }
.turno-ficha.off { opacity: .45; }
.enlace { display: block; text-align: center; color: var(--muted); font-size: .9rem; }
.creditos { text-align: center; color: var(--muted); font-size: .74rem; opacity: .8; }
.creditos a { color: inherit; }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">La Rata necesita JavaScript activado.</p></noscript>
<script>
(() => {
  'use strict';

  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  const KEY_NAME = 'larata-nombre';
  const KEY_SESSION = 'larata-sesion';

/*CARDS_JS*/

  const SUIT_CODE = { o: 'oros', c: 'copas', e: 'espadas', b: 'bastos' };
  const dec = (s) => (s ? { rank: parseInt(s, 10), suit: SUIT_CODE[s.slice(-1)] } : null);
  const cardName = (c) => `${RANK_NAME[c.rank] || c.rank} de ${c.suit}`;

  // ---------- utilidades ----------
  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'html') n.innerHTML = v; // solo SVG fijos de este archivo
        else if (k === 'tap') onTap(n, v);
        else if (k === 'style') n.style.cssText = v;
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      n.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
    }
    return n;
  }
  /** Toque fiable en Android: dispara al levantar el dedo y no repite con el clic. */
  function onTap(el, fn) {
    let last = 0;
    el.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (el.disabled) return;
      last = Date.now(); fn(e);
    });
    el.addEventListener('click', (e) => { if (Date.now() - last < 700 || el.disabled) return; fn(e); });
  }
  const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));
  function anim(el, frames, opts) {
    if (!el || !el.animate || reduceMotion) return Promise.resolve();
    return el.animate(frames, Object.assign({ duration: 400, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }, opts)).finished.catch(() => {});
  }
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (_) { /* sin vibración */ } }
  function toast(text) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = h('div', { class: 'toast', role: 'status' }, text);
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (_) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) { /* sin almacenamiento */ } },
    del(k) { try { localStorage.removeItem(k); } catch (_) { /* sin almacenamiento */ } },
  };

  function cardTags(card) {
    const tags = [];
    if (card.suit === 'bastos' && card.rank === 1) tags.push(h('span', { class: 'sello malo' }, 'As de bastos: −2 vidas'));
    if (card.suit === 'bastos' && card.rank === 12) tags.push(h('span', { class: 'sello bueno' }, 'Rey de bastos: +1 vida'));
    return tags;
  }

  // =====================================================================
  //  CONEXIÓN CON EL SERVIDOR
  // =====================================================================
  let ws = null;
  let connected = false;
  let everConnected = false;
  let retryMs = 800;
  let session = store.get(KEY_SESSION); // { code, token, playerId }
  let resuming = false;
  let snap = null;
  let myName = store.get(KEY_NAME) || '';
  let pending = null; // acción enviada esperando respuesta

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    try { ws = new WebSocket(`${proto}://${location.host}/ws`); } catch (_) { scheduleReconnect(); return; }
    ws.onopen = () => {
      connected = true; everConnected = true; retryMs = 800;
      if (session) { resuming = true; send({ type: 'resume', code: session.code, token: session.token }); }
      render();
    };
    ws.onmessage = (e) => { let m; try { m = JSON.parse(e.data); } catch (_) { return; } onMessage(m); };
    ws.onclose = () => { connected = false; renderConnection(); scheduleReconnect(); };
    ws.onerror = () => {};
  }
  function scheduleReconnect() {
    setTimeout(connect, retryMs);
    retryMs = Math.min(retryMs * 1.7, 8000);
  }
  // Al volver a la app (móvil bloqueado, cambio de app), reconecta enseguida.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && ws && ws.readyState > 1) { retryMs = 400; connect(); }
  });

  function send(msg) {
    if (!ws || ws.readyState !== 1) { toast('Sin conexión con el servidor. Reintentando…'); return false; }
    ws.send(JSON.stringify(msg));
    return true;
  }
  function act(type, extra) {
    if (pending) return;
    if (!send(Object.assign({ type }, extra || {}))) return;
    pending = type;
    render();
    setTimeout(() => { if (pending === type) { pending = null; render(); } }, 6000);
  }

  function onMessage(m) {
    if (m.type === 'joined') {
      resuming = false;
      session = { code: m.code, token: m.token, playerId: m.playerId };
      store.set(KEY_SESSION, session);
      history.replaceState(null, '', `/?sala=${m.code}`);
      return;
    }
    if (m.type === 'state') { pending = null; receive(m.snap); return; }
    if (m.type === 'kicked') { leaveRoom(); toast('La mesa te ha sacado de la sala.'); return; }
    if (m.type === 'error') {
      pending = null;
      if (resuming) { resuming = false; leaveRoom(); toast('Esa partida ya no existe. Entra en una sala nueva.'); return; }
      toast(m.message);
      render();
    }
  }

  function leaveRoom() {
    session = null; snap = null; store.del(KEY_SESSION);
    history.replaceState(null, '', '/');
    resetAnimState();
    render();
  }

  // =====================================================================
  //  ESTADO Y ANIMACIONES
  // =====================================================================
  let shownCard = null;
  let banner = null;
  let cardHidden = false;
  let animating = false;
  let queued = false;
  let showWinner = false;
  let overTimer = null;
  let sheet = null;
  let lastTurnBuzz = '';

  function resetAnimState() { shownCard = null; banner = null; cardHidden = false; showWinner = false; clearTimeout(overTimer); overTimer = null; sheet = null; }

  const me = () => (snap ? snap.me : null);
  const isHost = () => !!snap && snap.host === snap.me;
  const P = (pid) => (snap && snap.pl ? snap.pl.find((x) => x.p === pid) : null);
  const nameOf = (pid) => {
    const p = P(pid) || (snap && snap.lobby ? snap.lobby.find((x) => x.p === pid) : null);
    return p ? p.n : '—';
  };
  const myCard = (s) => (s && s.c && s.c[s.me] ? dec(s.c[s.me]) : null);

  function receive(b) {
    if (!b || typeof b !== 'object') return;
    const a = snap;
    if (a && a.sid === b.sid && b.v < a.v) return;
    snap = b;
    if (b.k !== 'juego' || b.ph !== 'over') { showWinner = false; clearTimeout(overTimer); overTimer = null; }
    if (b.k !== 'juego') { banner = null; shownCard = null; render(); return; }

    const sameRound = a && a.k === 'juego' && a.sid === b.sid && a.r === b.r;
    const newActs = sameRound ? b.ac.slice(a.ac.length) : [];
    let effect = null;
    if (!sameRound && b.ph === 'turns') { effect = 'reparto'; banner = null; cardHidden = false; }
    for (const [type, pid, other] of newActs) {
      if (type === 'swap' && pid === b.me) { effect = 'cambio-mio'; banner = { kind: 'cambiado', other }; }
      else if (type === 'swap' && other === b.me) { effect = 'cambio-recibido'; banner = { kind: 'recibido', other: pid }; }
      else if (type === 'draw' && pid === b.me) { effect = 'levanto'; banner = { kind: 'levantado' }; }
    }
    if (b.ph !== 'turns') banner = null;
    const oldCard = shownCard;
    const newCard = myCard(b);
    shownCard = newCard;
    const revealAnim = b.ph !== 'turns' && (!a || a.k !== 'juego' || a.ph === 'turns' || a.r !== b.r || a.sid !== b.sid);
    render({ effect: effect && newCard ? effect : null, oldCard, revealAnim });
  }

  // =====================================================================
  //  PANTALLAS
  // =====================================================================
  const app = document.getElementById('app');

  function render(fx = {}) {
    if (animating) { queued = true; return; }
    const focused = document.activeElement && document.activeElement.id;
    const sel = focused && document.activeElement.selectionStart;
    app.replaceChildren(pickScreen()(fx));
    if (focused) {
      const el = document.getElementById(focused);
      if (el) { el.focus(); try { el.setSelectionRange(sel, sel); } catch (_) { /* no es texto */ } }
    }
    renderSheet();
    renderConnection();
  }

  function pickScreen() {
    if (!everConnected) return screenConnecting;
    if (!snap) return session && resuming ? screenConnecting : screenHome;
    if (snap.k === 'sala') return screenLobby;
    if (snap.ph === 'turns') return screenTurns;
    if (snap.ph === 'reveal') return (fx) => revealScreen(fx, false);
    return screenOver;
  }

  function cabecera(extra) {
    return h('header', { class: 'cabecera' },
      h('div', { class: 'marca', html: RAT_SMALL }),
      h('span', { class: 'ronda' }, extra || ''),
      snap && snap.k === 'juego' ? h('button', { class: 'btn chico', tap: () => { sheet = 'marcador'; renderSheet(); } }, 'Marcador')
        : snap ? h('button', { class: 'btn chico fantasma', tap: () => { sheet = 'salir'; renderSheet(); } }, 'Salir') : null);
  }

  function screenConnecting() {
    return h('section', { class: 'screen' }, h('div', { class: 'pasa' },
      h('div', { class: 'abanico', 'aria-hidden': 'true' }, naipe(null), naipe(null), naipe(null)),
      h('h1', { class: 'titulo' }, 'La Rata'),
      h('p', { class: 'muted puntos' }, session ? 'Volviendo a tu partida' : 'Conectando')));
  }

  function nameField() {
    const input = h('input', { id: 'mi-nombre', type: 'text', maxlength: '20', autocomplete: 'nickname', enterkeyhint: 'done', placeholder: 'Tu nombre', 'aria-label': 'Tu nombre' });
    input.value = myName;
    input.addEventListener('input', () => { myName = input.value.slice(0, 20); store.set(KEY_NAME, myName); });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
    return h('div', { class: 'campo campo-solo' }, input);
  }
  function needName() {
    myName = (myName || '').replace(/\s+/g, ' ').trim();
    store.set(KEY_NAME, myName);
    if (!myName) { toast('Escribe tu nombre primero.'); const el = document.getElementById('mi-nombre'); if (el) el.focus(); return true; }
    return false;
  }

  // --- instalar la app ---
  let installEvent = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvent = e; render(); });
  window.addEventListener('appinstalled', () => { installEvent = null; toast('App instalada. Ya la tienes en la pantalla de inicio.'); render(); });
  const standalone = () => (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);

  function installCard() {
    if (standalone()) return null;
    if (installEvent) {
      return h('div', { class: 'instalar' }, h('p', null, 'Instala La Rata para abrirla como una app más.'),
        h('button', { class: 'btn chico oro', tap: async () => { const e = installEvent; installEvent = null; try { await e.prompt(); } catch (_) { /* cancelado */ } render(); } }, 'Instalar'));
    }
    if (isIOS()) return h('div', { class: 'instalar' }, h('p', null, 'Para instalarla: pulsa Compartir en Safari y luego «Añadir a pantalla de inicio».'));
    return null;
  }

  function screenHome() {
    const params = new URLSearchParams(location.search);
    const fromLink = (params.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5);
    const code = h('input', { id: 'codigo', class: 'codigo-input', type: 'text', maxlength: '5', autocomplete: 'off', autocapitalize: 'characters', enterkeyhint: 'go', placeholder: 'CÓDIGO', 'aria-label': 'Código de sala' });
    code.value = fromLink;
    const join = () => {
      if (needName()) return;
      const c = code.value.trim().toUpperCase();
      if (c.length !== 5) { toast('El código tiene 5 letras.'); code.focus(); return; }
      act('join', { code: c, name: myName });
    };
    code.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); join(); } });
    const crear = h('button', { class: `btn ${fromLink ? '' : 'oro'}`, disabled: pending ? true : null, tap: () => { if (needName()) return; act('create', { name: myName, config: { lives: 2 } }); } }, 'Crear una sala');
    const unir = h('button', { class: `btn ${fromLink ? 'oro' : ''}`, disabled: pending ? true : null, tap: join }, 'Entrar');
    return h('section', { class: 'screen' },
      h('div', { class: 'portada' },
        h('div', { class: 'abanico', 'aria-hidden': 'true' }, naipe(null), naipe({ rank: 1, suit: 'oros' }, { up: true }), naipe(null)),
        h('h1', { class: 'titulo' }, 'La Rata'),
        franja(),
        h('div', { class: 'banderas' }, h('span', { class: 'bandera', html: FLAG_ESPANA }), h('p', { class: 'muted' }, 'Cada uno con su móvil y su carta'), h('span', { class: 'bandera', html: FLAG_BORGONA }))),
      installCard(),
      h('div', { class: 'bloque' }, h('span', { class: 'etiqueta' }, 'TU NOMBRE'), nameField()),
      h('div', { class: 'bloque' }, h('span', { class: 'etiqueta' }, fromLink ? 'TE HAN INVITADO A LA SALA' : 'ENTRAR CON CÓDIGO'), h('div', { class: 'unirse' }, code, unir)),
      h('p', { class: 'separador' }, 'o'),
      crear,
      h('details', { class: 'reglas' }, h('summary', null, 'Reglas'), h('ul', null,
        h('li', null, 'Cada uno recibe una carta y solo ve la suya.'),
        h('li', null, 'En tu turno te la quedas o la cambias con el siguiente. Si te la cambian, verás cómo se va tu carta y llega la suya.'),
        h('li', null, 'Quien reparte en cada ronda (va rotando) juega el último. Si tiene la carta más baja puede levantar baraja: si la que saca es mayor que la más baja de otro, pierde ese otro.'),
        h('li', null, 'Gana la carta más baja. Un 12 gana la ronda al momento.'),
        h('li', null, 'As de bastos: −2 vidas. Rey de bastos: +1 vida, salvo con pelle.'),
        h('li', null, 'Sin vidas quedas fuera. Gana el último que siga vivo.'))),
      h('a', { class: 'enlace', href: '/una-pantalla.html' }, '¿Solo hay un móvil? Jugad pasándolo de mano en mano'),
      h('p', { class: 'creditos' }, 'Naipes: baraja española de Basquetteur (Wikimedia Commons), ', h('a', { href: 'https://creativecommons.org/licenses/by-sa/3.0/deed.es', target: '_blank', rel: 'noopener' }, 'CC BY-SA 3.0'), '. Oros retocados.'));
  }

  async function shareCode() {
    const url = `${location.origin}/?sala=${snap.code}`;
    const text = `Únete a mi partida de La Rata. Código: ${snap.code}`;
    try {
      if (navigator.share) { await navigator.share({ title: 'La Rata', text, url }); return; }
    } catch (_) { return; }
    try { await navigator.clipboard.writeText(`${text}\n${url}`); toast('Enlace copiado. Pégalo en el grupo.'); }
    catch (_) { toast(url); }
  }

  function screenLobby() {
    const host = isHost();
    const online = new Set(snap.on || []);
    const lobby = snap.lobby;
    const lista = h('div', { class: 'sala-lista' }, lobby.map((x, i) => h('div', { class: `sala-fila ${online.has(x.p) ? '' : 'desconectado'}` },
      h('span', { class: 'asiento-n' }, i + 1),
      h('span', { class: 'nm' }, x.n, x.p === snap.me ? h('span', { class: 'tu' }, '  · tú') : null, x.p === snap.host ? h('span', { class: 'tu' }, '  · lleva la mesa') : null),
      host ? h('div', { class: 'ctrl' },
        h('button', { 'aria-label': `Subir a ${x.n}`, disabled: i === 0 ? true : null, tap: () => send({ type: 'move', target: x.p, delta: -1 }) }, '↑'),
        h('button', { 'aria-label': `Bajar a ${x.n}`, disabled: i === lobby.length - 1 ? true : null, tap: () => send({ type: 'move', target: x.p, delta: 1 }) }, '↓'),
        x.p !== snap.me ? h('button', { 'aria-label': `Sacar a ${x.n}`, tap: () => send({ type: 'kick', target: x.p }) }, '×') : null) : h('span'))));

    const parts = [cabecera(host ? 'Tú llevas la mesa' : `Mesa de ${nameOf(snap.host)}`),
      h('div', { class: 'codigo-sala' }, franja('arriba'), h('span', { class: 'eyebrow' }, 'Código de la sala'), h('span', { class: 'letras' }, snap.code),
        h('button', { class: 'btn chico', tap: shareCode }, h('span', { html: ICON.compartir }), 'Invitar por WhatsApp o enlace')),
      h('div', { class: 'resultado' }, h('h2', null, `${lobby.length} en la mesa`)),
      lista,
      h('p', { class: 'nota' }, 'Ordenad la lista como estáis sentados: en tu turno cambias la carta con el siguiente de la lista, y el último con el primero.')];

    if (host) {
      const contador = (label, key, min, max) => h('div', { class: 'contador-caja' }, h('span', { class: 'etiqueta' }, label),
        h('div', { class: 'contador' },
          h('button', { 'aria-label': `Menos ${label.toLowerCase()}`, tap: () => send({ type: 'config', config: { [key]: Math.max(min, snap.cfg[key] - 1) } }) }, '−'),
          h('output', null, snap.cfg[key]),
          h('button', { 'aria-label': `Más ${label.toLowerCase()}`, tap: () => send({ type: 'config', config: { [key]: Math.min(max, snap.cfg[key] + 1) } }) }, '+')));
      const tie = h('select', { id: 'empate', class: 'campo', 'aria-label': 'Empate en la carta más baja' },
        h('option', { value: 'empate_todos_ganan' }, 'Los empatados ganan; el resto pierde'),
        h('option', { value: 'empate_todos_pierden' }, 'Los empatados pierden; el resto no'));
      tie.value = snap.cfg.tie;
      tie.addEventListener('change', () => send({ type: 'config', config: { tie: tie.value } }));
      const enough = lobby.length >= snap.cfg.min;
      parts.push(h('div', { class: 'ajustes' }, contador('VIDAS', 'lives', 1, 20), contador('PIERDES POR RONDA', 'lost', 1, 5)),
        h('div', { class: 'bloque' }, h('label', { for: 'empate' }, 'SI EMPATAN CON LA MÁS BAJA'), tie),
        h('div', { class: 'acciones' }, h('button', { class: 'btn oro', disabled: !enough || pending ? true : null, tap: () => act('start') }, enough ? 'Repartir cartas' : 'Esperando jugadores')));
    } else {
      parts.push(h('p', { class: 'muted small' }, `${snap.cfg.lives} vidas · pierdes ${snap.cfg.lost} por ronda`),
        h('div', { class: 'acciones' }, h('p', { class: 'estado-turno puntos' }, `Esperando a que ${nameOf(snap.host)} reparta las cartas`)));
    }
    return h('section', { class: 'screen' }, parts);
  }

  function ordenTurnos() {
    return h('div', { class: 'orden', 'aria-label': 'Orden de turnos' }, snap.to.map((pid, i) => {
      const p = P(pid);
      const act = snap.ac.find((a) => a[1] === pid && a[0] !== 'penalty');
      const hizo = act ? { keep: 'se quedó', swap: 'cambió', draw: 'levantó' }[act[0]] : null;
      return h('div', { class: `turno-ficha ${i === snap.ti ? 'ahora' : ''} ${i < snap.ti ? 'hecho' : ''} ${p.pe ? 'pelle' : ''} ${p.on ? '' : 'off'}` },
        h('span', { class: 'ini' }, i + 1), h('span', { class: 'nm' }, pid === snap.me ? 'Tú' : p.n), h('span', { class: 'vidas' }, `♥${p.l}`), hizo ? h('span', { class: 'hizo' }, hizo) : null);
    }));
  }

  function nextAliveAfter(pid) {
    const pl = snap.pl;
    const i = pl.findIndex((x) => x.p === pid);
    for (let k = 1; k < pl.length; k++) { const x = pl[(i + k) % pl.length]; if (x.a) return x.p; }
    return null;
  }

  function hostTurnTools() {
    if (!isHost() || snap.cur === snap.me) return null;
    const cur = P(snap.cur);
    return h('div', { class: 'anfitrion-extra' }, h('button', { class: `btn chico ${cur && !cur.on ? 'rojo' : 'fantasma'}`, tap: () => act('skip') },
      `${cur && !cur.on ? 'Sin conexión: ' : ''}pasar el turno de ${nameOf(snap.cur)}`));
  }

  function screenTurns(fx) {
    const mine = P(snap.me);
    const card = myCard(snap);
    const myTurn = snap.cur === snap.me;
    const parts = [cabecera(`Ronda ${snap.r}`), ordenTurnos()];

    if (banner && card) {
      const txt = banner.kind === 'recibido'
        ? [h('strong', null, nameOf(banner.other)), ' te ha cambiado la carta. Se ha llevado la tuya y te ha dado esta.']
        : banner.kind === 'cambiado'
          ? ['Le has dado tu carta a ', h('strong', null, nameOf(banner.other)), '. Ahora tienes la suya.']
          : ['Has levantado baraja. Esta es tu carta nueva.'];
      parts.push(h('div', { class: `banner-cambio ${banner.kind === 'recibido' ? '' : 'mio'}`, role: 'status' }, h('span', { html: ICON.cambio }), h('p', null, txt)));
    }

    if (!card) {
      parts.push(h('div', { class: 'espectador' },
        h('span', { class: 'eyebrow' }, mine && !mine.a ? 'TE HAS QUEDADO SIN VIDAS' : 'ESTÁS MIRANDO'),
        h('p', { class: 'muted' }, mine && !mine.a ? 'Sigue la partida desde aquí.' : 'Entrarás en la siguiente partida.'),
        h('p', { class: 'estado-turno' }, 'Turno de ', h('b', null, nameOf(snap.cur)))));
      const tools = hostTurnTools();
      if (tools) parts.push(tools);
      return h('section', { class: 'screen' }, parts);
    }

    const startCard = fx.effect && fx.effect !== 'reparto' && fx.oldCard ? fx.oldCard : card;
    const carta = naipe(startCard, { up: !cardHidden && fx.effect !== 'reparto', cls: 'toca' });
    const toggle = (el) => onTap(el, () => { if (animating) return; cardHidden = !cardHidden; el.classList.toggle('boca-arriba', !cardHidden); fill(card); });
    toggle(carta);
    const leyenda = h('div', { class: 'leyenda' });
    const fill = (c) => leyenda.replaceChildren(h('span', { class: 'carta-nombre' }, cardHidden ? 'Carta tapada' : cardName(c)), h('div', { class: 'orden' }, cardHidden ? [] : cardTags(c)));
    if (!fx.effect) fill(card);
    parts.push(h('div', { class: 'mesa' }, h('div', { class: 'halo' }), carta), leyenda, h('p', { class: 'pista' }, 'Toca la carta para taparla o destaparla'));

    const acciones = h('div', { class: 'acciones' });
    if (myTurn) {
      const next = nextAliveAfter(snap.me);
      const busy = !!pending;
      acciones.append(...[
        h('p', { class: 'estado-turno' }, h('b', null, 'Te toca.'), ' ¿Te la quedas o la cambias?'),
        h('div', { class: 'duo' },
          h('button', { class: 'btn', disabled: busy ? true : null, tap: () => act('keep') }, h('span', { html: ICON.quedar }), 'Me la quedo'),
          h('button', { class: 'btn rojo', disabled: busy || !next ? true : null, tap: () => act('swap') }, h('span', { html: ICON.cambio }), next ? `Cambiar con ${nameOf(next)}` : 'Cambiar')),
        snap.cd === snap.me ? h('button', { class: 'btn oro', disabled: busy ? true : null, tap: () => act('draw') }, h('span', { html: ICON.baraja }), 'Levantar baraja') : null,
      ].filter(Boolean));
      const key = `${snap.sid}:${snap.r}:${snap.ti}`;
      if (lastTurnBuzz !== key) { lastTurnBuzz = key; vibrate([30, 40, 30]); }
    } else {
      acciones.append(h('p', { class: 'estado-turno' }, 'Turno de ', h('b', null, nameOf(snap.cur)), h('span', { class: 'puntos' })));
    }
    const tools = hostTurnTools();
    if (tools) acciones.append(tools);
    parts.push(acciones);

    if (fx.effect) animateCard(fx, carta, card, fill, toggle);
    return h('section', { class: 'screen' }, parts);
  }

  function animateCard(fx, carta, card, fill, toggle) {
    animating = true;
    requestAnimationFrame(async () => {
      let el = carta;
      if (fx.effect === 'reparto') {
        await anim(el, [{ transform: 'translateY(-60%) rotate(-8deg) scale(.8)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 520 });
      } else {
        const right = fx.effect === 'cambio-mio';
        const draw = fx.effect === 'levanto';
        const out = draw ? 'translateY(60%) scale(.8)' : `translateX(${right ? 140 : -140}%) rotate(${right ? 14 : -14}deg)`;
        const from = draw ? 'translateY(-90%) rotate(-6deg) scale(.8)' : `translateX(${right ? 140 : -140}%) rotate(${right ? 14 : -14}deg)`;
        vibrate(fx.effect === 'cambio-recibido' ? [50, 70, 50] : 30);
        if (el.classList.contains('boca-arriba')) { el.classList.remove('boca-arriba'); await wait(560); }
        await anim(el, [{ transform: 'none', opacity: 1 }, { transform: out, opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.8,.4)' });
        const nueva = naipe(card, { up: false, cls: 'toca' });
        toggle(nueva);
        el.replaceWith(nueva); el = nueva;
        await anim(el, [{ transform: from, opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 560 });
      }
      cardHidden = false;
      el.classList.add('boca-arriba');
      await wait(620);
      if (fx.effect !== 'reparto') el.classList.add('brilla');
      fill(card);
      animating = false;
      if (queued) { queued = false; render(); }
    });
  }

  function summary(res) {
    if (!res.w.length) return 'Empate en la carta más baja: nadie gana';
    return `${res.w.length > 1 ? 'Ganan' : 'Gana'} ${res.w.map(nameOf).join(', ')} ${res.tw ? 'con un 12' : 'con la carta más baja'}`;
  }

  function cronica(res) {
    const b = (pid) => h('b', null, pid === snap.me ? 'Tú' : nameOf(pid));
    const lines = res.ac.map(([t, pid, other]) => (t === 'keep' ? [b(pid), ' se quedó su carta']
      : t === 'swap' ? [b(pid), ' cambió con ', b(other)]
        : t === 'draw' ? [b(pid), ' levantó baraja'] : [b(pid), ' pierde por la baraja levantada']));
    for (const [pid, label, lives, blocked] of res.ef) lines.push(blocked ? [b(pid), ` tenía el ${label}, pero con el pelle no suma`] : [b(pid), ` · ${label}: ${lives > 0 ? '+' : ''}${lives} vida${Math.abs(lives) > 1 ? 's' : ''}`]);
    if (res.el.length) lines.push([h('b', null, res.el.map(nameOf).join(', ')), ' queda fuera']);
    return lines.length ? h('div', { class: 'cronica' }, lines.map((l) => h('p', null, l))) : null;
  }

  function revealScreen(fx, over) {
    const res = snap.res;
    if (!res) return h('section', { class: 'screen' }, cabecera(''), h('p', { class: 'estado-turno puntos' }, 'Revelando'));
    const animate = !!fx.revealAnim;
    const rejilla = h('div', { class: 'rejilla' });
    const items = [];
    for (const [pid, code] of res.rv) {
      const card = dec(code);
      const d = res.la[pid] - res.lb[pid];
      const win = res.w.includes(pid);
      const n = naipe(card, { up: !animate, cls: animate ? '' : (win ? 'brilla' : 'apagada') });
      const deltaTxt = d === 0 ? `♥${res.la[pid]}` : `${d > 0 ? '+' : ''}${d} · ♥${Math.max(0, res.la[pid])}`;
      const delta = h('span', { class: `delta ${d < 0 ? 'menos' : d > 0 ? 'mas' : ''}` }, animate ? '' : deltaTxt);
      const corona = win ? h('span', { class: 'corona', html: CROWN, style: animate ? 'opacity:0' : '' }) : null;
      rejilla.appendChild(h('div', { class: 'asiento' }, corona, n, h('span', { class: 'nm' }, pid === snap.me ? 'Tú' : nameOf(pid)), delta, res.el.includes(pid) ? h('span', { class: 'fuera' }, 'FUERA') : null));
      items.push({ n, delta, deltaTxt, win, corona });
    }
    const resumen = h('p', { class: 'muted', style: animate ? 'visibility:hidden' : '' }, summary(res));
    const acciones = h('div', { class: 'acciones' });
    if (isHost()) {
      acciones.append(over
        ? h('button', { class: 'btn oro', tap: () => { showWinner = true; render(); } }, 'Ver quién gana')
        : h('button', { class: 'btn oro', disabled: pending ? true : null, tap: () => act('next') }, 'Siguiente ronda'));
    } else {
      acciones.append(h('p', { class: 'estado-turno puntos' }, over ? 'Fin de la partida' : `Esperando a que ${nameOf(snap.host)} reparta`));
    }
    const screen = h('section', { class: 'screen' },
      cabecera(`Ronda ${res.r}`),
      h('div', { class: 'resultado' }, h('span', { class: 'eyebrow' }, res.tw ? '¡HA SALIDO UN 12!' : `RONDA ${res.r}`), h('h2', null, 'Cartas boca arriba'), resumen),
      rejilla, cronica(res), acciones);
    if (animate) {
      animating = true;
      requestAnimationFrame(async () => {
        await wait(350);
        for (const x of items) { x.n.classList.add('boca-arriba'); await wait(260); }
        await wait(500);
        for (const x of items) {
          if (x.win) { x.n.classList.add('brilla'); if (x.corona) { x.corona.style.opacity = ''; x.corona.classList.add('flota'); } } else x.n.classList.add('apagada');
          x.delta.textContent = x.deltaTxt; x.delta.classList.add('flota');
        }
        resumen.style.visibility = '';
        vibrate(60);
        animating = false;
        if (queued) { queued = false; render(); }
      });
    }
    return screen;
  }

  function screenOver(fx) {
    if (!showWinner) {
      if (!isHost() && !overTimer) overTimer = setTimeout(() => { overTimer = null; if (snap && snap.ph === 'over') { showWinner = true; render(); } }, 6000);
      return revealScreen(fx, true);
    }
    const winner = snap.win ? P(snap.win) : null;
    const ranking = snap.pl.slice().sort((a, b) => b.l - a.l || Number(b.a) - Number(a.a));
    const screen = h('section', { class: 'screen' },
      cabecera(`Ronda ${snap.r}`),
      h('div', { class: 'final' },
        h('div', { class: 'banderas' }, h('span', { class: 'bandera', html: FLAG_ESPANA }), h('span', { class: 'corona-grande', html: CROWN }), h('span', { class: 'bandera', html: FLAG_BORGONA })),
        h('span', { class: 'eyebrow' }, winner ? 'GANA LA PARTIDA' : 'NADIE SIGUE VIVO'),
        h('h2', { class: 'ganador' }, winner ? (winner.p === snap.me ? '¡Has ganado!' : winner.n) : 'Sin ganador')),
      h('div', { class: 'clasif' }, ranking.map((p) => h('div', { class: `fila ${p.p === snap.win ? 'primero' : ''}` }, h('span', null, p.n), h('span', { class: 'muted' }, p.a ? `♥${p.l}` : 'fuera')))),
      h('div', { class: 'acciones' }, isHost()
        ? [h('button', { class: 'btn oro', tap: () => act('rematch') }, 'Revancha con los mismos'),
          h('button', { class: 'btn fantasma', tap: () => act('lobby') }, 'Volver a la sala (entra o sale gente)')]
        : h('p', { class: 'estado-turno puntos' }, `Esperando a que ${nameOf(snap.host)} empiece otra`)));
    if (winner && !reduceMotion) {
      const c = h('div', { class: 'confeti', 'aria-hidden': 'true' });
      const colors = ['#c8102e', '#f1bf00', '#c8102e', '#f1bf00', '#ffffff'];
      for (let i = 0; i < 60; i++) c.appendChild(h('i', { style: `left:${Math.random() * 100}%;background:${colors[i % 5]};animation-duration:${2.2 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s` }));
      screen.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
    return screen;
  }

  // ---------- marcador y salir ----------
  function renderSheet() {
    document.querySelectorAll('.velo').forEach((v) => v.remove());
    if (!sheet || !snap) return;
    const cerrar = () => { sheet = null; renderSheet(); };
    if (sheet === 'salir') {
      document.body.appendChild(h('div', { class: 'velo centro' }, h('div', { class: 'dialogo', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Salir de la sala' },
        h('h3', null, '¿Salir de la sala?'),
        h('p', { class: 'muted' }, snap.k === 'juego' ? 'La partida sigue sin ti; tu turno lo puede pasar quien lleva la mesa.' : 'Dejarás tu sitio en la mesa.'),
        h('div', { class: 'duo' }, h('button', { class: 'btn', tap: cerrar }, 'Quedarme'),
          h('button', { class: 'btn rojo', tap: () => { send({ type: 'leave' }); leaveRoom(); } }, 'Salir')))));
      return;
    }
    if (snap.k !== 'juego') { sheet = null; return; }
    const host = isHost();
    const jugadores = h('div', { class: 'jugadores' }, snap.pl.map((p) => h('div', { class: `jug ${p.a ? '' : 'fuera'}` },
      h('span', { class: 'nm' }, p.p === snap.me ? `${p.n} (tú)` : p.n),
      h('span', { class: 'vidas' }, p.a ? `♥ ${p.l}` : 'fuera'),
      host ? h('button', { class: 'toggle', 'aria-pressed': String(!!p.pe), tap: () => send({ type: 'pelle', target: p.p }) }, p.pe ? 'Tiene pelle' : 'Dar pelle')
        : h('span', { class: 'muted small' }, p.pe ? 'pelle' : ''))));
    const historia = h('div', { class: 'historia' });
    (snap.hi || []).slice().reverse().forEach((e) => {
      historia.appendChild(h('div', { class: 'ent' }, h('h3', null, `Ronda ${e.r}`),
        h('p', null, e.rv.map(([pid, code]) => `${nameOf(pid)}: ${cardName(dec(code))}`).join(' · ')),
        h('p', { class: 'muted' }, e.w.length ? `Gana ${e.w.map(nameOf).join(', ')}${e.tw ? ' con un 12' : ''}` : 'Nadie gana'),
        h('p', { class: 'muted small' }, Object.entries(e.la).map(([pid, l]) => `${nameOf(pid)} ♥${Math.max(0, l)}`).join(' · '))));
    });
    if (!(snap.hi || []).length) historia.appendChild(h('p', { class: 'muted small' }, 'Aún no ha terminado ninguna ronda.'));
    const velo = h('div', { class: 'velo' }, h('div', { class: 'hoja', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Marcador' },
      h('div', { class: 'hoja-cab' }, h('h2', null, 'Marcador'), h('button', { class: 'btn chico', tap: cerrar }, 'Cerrar')),
      h('p', { class: 'muted small' }, `Sala ${snap.code}. ${host ? 'Quien tiene el pelle no recupera vida con el Rey de bastos.' : 'El pelle lo da quien lleva la mesa. Con pelle no se recupera vida con el Rey de bastos.'}`),
      jugadores, h('span', { class: 'etiqueta' }, 'RONDAS'), historia,
      h('button', { class: 'btn fantasma', tap: () => { sheet = 'salir'; renderSheet(); } }, 'Salir de la sala')));
    velo.addEventListener('click', (e) => { if (e.target === velo) cerrar(); });
    document.body.appendChild(velo);
  }

  function renderConnection() {
    document.querySelectorAll('.conexion').forEach((n) => n.remove());
    if (everConnected && !connected) document.body.appendChild(h('div', { class: 'conexion', role: 'status' }, 'Reconectando…'));
  }

  // ---------- arranque ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('/sw.js').catch(() => { /* la app funciona igual sin él */ });
  }
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (_) { /* sin bloqueo de pantalla */ }
  render();
  connect();
  setTimeout(preloadCards, 1500);
})();
</script>
</body>
</html>
