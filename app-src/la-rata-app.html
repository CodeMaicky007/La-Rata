<meta charset="utf-8">
<title>La Rata</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b2e22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="La Rata">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/*BASE_CSS*/
.mesa .naipe { --w: min(54vw, 220px, 30dvh); }
.duo .btn { font-size: 1.05rem; padding-inline: 12px; }
.logo-grande { aspect-ratio: 1; object-fit: cover; -webkit-mask-image: radial-gradient(circle, #000 62%, transparent 71%); mask-image: radial-gradient(circle, #000 62%, transparent 71%); filter: drop-shadow(0 14px 26px rgba(0,0,0,.5)); animation: logo-pop .7s cubic-bezier(.2,1.4,.4,1) both; }
@keyframes logo-pop { from { opacity: 0; transform: scale(.7) rotate(-6deg); } }
.estado-turno b { color: var(--gualda); }
</style>

<div id="app"></div>

<script>
/*GAME_JS*/
</script>
<script>
(() => {
  'use strict';

  const G = window.LaRataGame;
  const STORE = 'larata-una-pantalla-v2';
  const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/*CARDS_JS*/

  // ---------- estado ----------
  let state = null;
  let ui = { stage: 'setup' };
  let setup = { count: 4, names: [], lives: 2 };
  let busy = false;
  let sheet = null; // 'marcador' | 'salir' | null
  const app = document.getElementById('app');

  // ---------- utilidades ----------
  function h(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') n.className = v;
        else if (k === 'html') n.innerHTML = v; // solo para SVG fijos definidos arriba
        else if (k === 'tap') onTap(n, v);
        else if (k === 'style') n.style.cssText = v;
        else n.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      n.appendChild(typeof kid === 'string' || typeof kid === 'number' ? document.createTextNode(String(kid)) : kid);
    }
    return n;
  }

  /** Toque fiable en Android: dispara al levantar el dedo y evita el doble disparo del clic. */
  function onTap(el, fn) {
    let last = 0;
    el.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (el.disabled) return;
      last = Date.now();
      fn(e);
    });
    el.addEventListener('click', (e) => {
      if (Date.now() - last < 700) return;
      if (el.disabled) return;
      fn(e);
    });
  }

  const wait = (ms) => new Promise((r) => setTimeout(r, reduceMotion ? 0 : ms));
  function anim(el, frames, opts) {
    if (!el || !el.animate || reduceMotion) return Promise.resolve();
    const a = el.animate(frames, Object.assign({ duration: 400, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' }, opts));
    return a.finished.catch(() => {});
  }
  async function flip(el, up) {
    el.classList.toggle('boca-arriba', up);
    await wait(620);
  }
  function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (_) { /* sin vibración */ } }

  let toastTimer = null;
  function toast(text) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = h('div', { class: 'toast', role: 'status' }, text);
    document.body.appendChild(t);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.remove(), 3200);
  }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify({ state, ui, setup })); } catch (_) { /* almacenamiento no disponible */ }
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.setup) setup = Object.assign(setup, data.setup);
      if (data.state && data.state.phase && data.state.phase !== 'lobby') {
        state = data.state;
        ui = data.ui || { stage: 'cover' };
        // Por privacidad, al volver a abrir nunca se enseña una carta: se tapa la pantalla.
        if (ui.stage === 'turn' || ui.stage === 'after') ui = { stage: state.phase === 'turns' ? 'cover' : 'prereveal' };
      }
    } catch (_) { /* datos guardados no válidos: se empieza de cero */ }
  }

  let wakeLock = null;
  async function keepAwake() {
    try { if (!wakeLock && navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (_) { wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { wakeLock = null; if (state) keepAwake(); } });

  const P = (id) => state.players.find((p) => p.id === id);
  const nameOf = (id) => (P(id) ? P(id).name : '—');
  const namesOf = (ids) => ids.map(nameOf).join(', ');
  const cardName = (c) => `${RANK_NAME[c.rank] || c.rank} de ${c.suit}`;
  const current = () => G.currentPlayerId(state);
  const nextOf = (id) => G.publicView(state, id).you.next;
  const lastEntry = () => state.history[state.history.length - 1];

  // ---------- naipe ----------

  function cardTags(card) {
    const tags = [];
    if (card.suit === 'bastos' && card.rank === 1) tags.push(h('span', { class: 'sello malo' }, 'As de bastos: quita 2 vidas'));
    if (card.suit === 'bastos' && card.rank === 12) tags.push(h('span', { class: 'sello bueno' }, 'Rey de bastos: +1 vida (sin pelle)'));
    return tags;
  }

  // ---------- pantallas ----------
  function render() {
    app.replaceChildren();
    const screens = { setup: renderSetup, cover: renderCover, turn: renderTurn, after: renderAfter, prereveal: renderPrereveal, reveal: renderReveal, over: renderOver };
    app.appendChild((screens[ui.stage] || renderSetup)());
    renderSheet();
    save();
  }

  function volverInicio() {
    // En la web, el inicio es el menú principal; en el archivo suelto, la pantalla de preparar partida.
    if (location.protocol.startsWith('http') && /una-pantalla/.test(location.pathname)) { save(); location.href = '/'; return; }
    if (state) { sheet = 'salir'; renderSheet(); return; }
    ui = { stage: 'setup' }; render();
  }

  function cabecera() {
    const info = state ? `Ronda ${state.round}` : '';
    return h('header', { class: 'cabecera' },
      h('button', { class: 'marca', html: RAT_SMALL, 'aria-label': 'Volver al inicio', tap: volverInicio }),
      h('span', { class: 'ronda' }, info),
      h('button', { class: 'btn chico', tap: () => { sheet = 'marcador'; renderSheet(); } }, 'Marcador'));
  }

  // --- configuración ---
  function renderSetup() {
    while (setup.names.length < 8) setup.names.push('');
    const fichas = h('div', { class: 'fichas', role: 'group', 'aria-label': 'Número de jugadores' });
    for (let n = 2; n <= 8; n++) {
      fichas.appendChild(h('button', { class: 'ficha', 'aria-pressed': String(setup.count === n), tap: () => { setup.count = n; render(); } }, n));
    }
    const nombres = h('div', { class: 'nombres' });
    for (let i = 0; i < setup.count; i++) {
      const input = h('input', { id: `nombre-${i}`, type: 'text', maxlength: '20', autocomplete: 'off', placeholder: `Jugador ${i + 1}`, 'aria-label': `Nombre del jugador ${i + 1}` });
      input.value = setup.names[i];
      input.addEventListener('input', () => { setup.names[i] = input.value; save(); });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } });
      nombres.appendChild(h('div', { class: 'campo' }, h('span', { class: 'num' }, i + 1), input));
    }

    const contador = (label, key, min, max) => {
      const out = h('output', { 'aria-live': 'polite' }, setup[key]);
      const set = (v) => { setup[key] = Math.max(min, Math.min(max, v)); out.textContent = setup[key]; save(); };
      return h('div', { class: 'contador-caja' },
        h('span', { class: 'etiqueta' }, label),
        h('div', { class: 'contador' },
          h('button', { 'aria-label': `Menos ${label.toLowerCase()}`, tap: () => set(setup[key] - 1) }, '−'),
          out,
          h('button', { 'aria-label': `Más ${label.toLowerCase()}`, tap: () => set(setup[key] + 1) }, '+')));
    };



    const start = h('button', { class: 'btn oro', tap: startFromSetup }, 'Repartir cartas');
    start.addEventListener('pointerdown', () => { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); });

    return h('section', { class: 'screen' },
      h('div', { class: 'portada' },
        h('img', { class: 'logo-grande', src: logoSrc(), alt: 'La Rata' }),
        h('p', { class: 'muted' }, 'Un móvil para toda la mesa. Cada uno mira solo su carta.')),
      h('div', { class: 'bloque' }, h('span', { class: 'etiqueta' }, 'JUGADORES'), fichas, nombres),
      h('div', { class: 'ajustes' }, contador('VIDAS INICIALES', 'lives', 1, 20), h('p', { class: 'muted small', style: 'align-self:end' }, 'Cada ronda pierde 1 vida quien tiene la carta más baja.')),
      h('details', { class: 'reglas' },
        h('summary', null, 'Reglas'),
        h('ul', null,
          h('li', null, 'Cada uno recibe una carta y solo mira la suya.'),
          h('li', null, 'En tu turno te la quedas o la cambias con el siguiente. Si te la cambian, lo verás al coger el móvil.'),
          h('li', null, 'Quien reparte (va rotando) juega el último. Si tiene la carta más baja puede levantar baraja y quedarse la carta de arriba del mazo.'),
          h('li', null, 'Al final se enseñan las cartas: pierde 1 vida quien tenga la más baja. Si empatan, pierden todos los empatados.'),
          h('li', null, 'As de bastos: quien lo tiene pierde 2 vidas en total. Rey de bastos: +1 vida, salvo con pelle.'),
          h('li', null, 'Sin vidas quedas fuera. Gana el último que siga vivo. Si los últimos caen a la vez, repiten ronda entre ellos.'),
          h('li', null, 'Naipes: baraja española de Basquetteur (Wikimedia Commons), CC BY-SA 3.0. Oros retocados.'))),
      h('div', { class: 'acciones' }, start));
  }

  function startFromSetup() {
    if (busy) return;
    const names = setup.names.slice(0, setup.count).map((n, i) => (n || '').trim() || `Jugador ${i + 1}`);
    if (new Set(names.map((n) => n.toLowerCase())).size !== names.length) { toast('Hay dos jugadores con el mismo nombre. Cambia uno.'); return; }
    try {
      state = G.createGame({ lives: setup.lives, maxPlayers: 8 });
      names.forEach((name, i) => G.addPlayer(state, { id: 'j' + i, token: 'local', name }));
      G.startGame(state, state.hostId);
    } catch (err) {
      state = null;
      toast(err.message);
      return;
    }
    keepAwake();
    goAfterDeal();
  }

  function goAfterDeal() {
    ui = state.phase === 'turns' ? { stage: 'cover' } : { stage: 'prereveal', note: 'twelveDeal' };
    render();
  }

  // --- orden de turnos (público) ---
  function ordenTurnos() {
    const wrap = h('div', { class: 'orden', 'aria-label': 'Orden de turnos' });
    state.turnOrder.forEach((id, i) => {
      const p = P(id);
      const act = state.roundActions.find((a) => a.playerId === id && a.type !== 'penalty');
      const done = state.phase !== 'turns' || i < state.turnIdx;
      const now = state.phase === 'turns' && i === state.turnIdx;
      const hizo = act ? { keep: 'se quedó', swap: 'cambió', draw: 'levantó' }[act.type] : null;
      wrap.appendChild(h('div', { class: `turno-ficha ${now ? 'ahora' : ''} ${done ? 'hecho' : ''} ${p.pelle ? 'pelle' : ''}` },
        h('span', { class: 'ini' }, i + 1),
        h('span', { class: 'nm' }, p.name),
        h('span', { class: 'vidas' }, `♥${p.lives}`),
        hizo ? h('span', { class: 'hizo' }, hizo) : null));
    });
    return wrap;
  }

  // --- pasar el móvil ---
  function renderCover() {
    const id = current();
    const p = P(id);
    const ver = h('button', { class: 'btn oro', tap: () => { if (busy) return; ui = { stage: 'turn', fresh: true }; render(); } },
      h('span', { html: ICON.mano }), `Soy ${p.name}: ver mi carta`);
    return h('section', { class: 'screen' },
      cabecera(),
      h('div', { class: 'pasa' },
        h('span', { class: 'eyebrow' }, 'PASA EL MÓVIL A'),
        h('div', { class: 'moneda', 'aria-hidden': 'true' }, p.name.charAt(0).toUpperCase()),
        h('h2', { class: 'quien' }, p.name),
        h('p', { class: 'aviso-privado' }, h('span', { html: ICON.ojo }), 'Que nadie más mire la pantalla.')),
      ordenTurnos(),
      h('div', { class: 'acciones' }, ver));
  }

  // --- turno: solo se ve la carta de quien tiene el móvil ---
  function renderTurn() {
    const id = current();
    const me = P(id);
    const view = G.publicView(state, id);
    const card = view.you.card;
    const swapIn = state.roundActions.find((a) => a.type === 'swap' && a.neighborId === id);
    const fresh = ui.fresh;
    ui.fresh = false;

    const carta = naipe(card, { up: !fresh });
    const leyenda = h('div', { class: 'leyenda' });
    const fillLeyenda = () => {
      leyenda.replaceChildren(h('span', { class: 'carta-nombre' }, cardName(card)), h('div', { class: 'orden' }, cardTags(card)));
    };
    if (!fresh) fillLeyenda();

    const next = view.you.next;
    const isLast = state.turnIdx === state.turnOrder.length - 1;
    const botones = [];
    const quedar = h('button', { class: 'btn', tap: () => doKeep(id) }, h('span', { html: ICON.quedar }), 'Me la quedo');
    const cambiar = h('button', { class: 'btn rojo', tap: () => doSwap(id, card, carta) }, h('span', { html: ICON.cambio }), next ? h('span', { class: 'lbl' }, 'Cambiar', h('small', null, `con ${nameOf(next)}`)) : 'Cambiar');
    cambiar.disabled = !next;
    botones.push(quedar, cambiar);
    if (view.you.canDraw) botones.push(h('button', { class: 'btn oro', tap: () => doDraw(id, carta) }, h('span', { html: ICON.baraja }), 'Levantar'));

    const screen = h('section', { class: 'screen' },
      h('header', { class: 'cabecera' },
        h('button', { class: 'marca', html: RAT_SMALL, 'aria-label': 'Volver al inicio', tap: volverInicio }),
        h('span', { class: 'ronda' }, `${me.name} · ♥${me.lives}${me.pelle ? ' · pelle' : ''}${isLast ? ' · último turno' : ''}`)),
      swapIn ? h('div', { class: 'banner-cambio', role: 'status' }, h('span', { html: ICON.cambio }),
        h('p', null, h('strong', null, nameOf(swapIn.playerId)), ' te ha cambiado la carta. Esta es la que te ha dado.')) : null,
      h('p', { class: 'estado-turno' }, h('b', null, 'Te toca.'), ' ¿Te la quedas o la cambias?'),
      h('div', { class: 'mesa-grande' }, h('div', { class: 'carta-marco' }, carta,
        h('div', { class: 'sobre arriba' }, leyenda),
        h('div', { class: 'sobre abajo' }, h('div', { class: `botonera ${botones.length === 3 ? 'tres' : ''}` }, botones)))),
      h('button', { class: 'btn fantasma chico tapar', tap: () => { if (busy) return; ui = { stage: 'cover' }; render(); } }, h('span', { html: ICON.ojo }), 'Tapar y pasar el móvil'));
    screen.classList.add('turno');

    if (fresh) {
      busy = true;
      requestAnimationFrame(async () => {
        if (swapIn) {
          vibrate([40, 60, 40]);
          await anim(carta, [{ transform: 'translateX(-130%) rotate(-14deg)', opacity: 0 }, { transform: 'translateX(8%) rotate(3deg)', opacity: 1, offset: .75 }, { transform: 'none', opacity: 1 }], { duration: 650 });
        } else {
          await anim(carta, [{ transform: 'translateY(40%) scale(.85)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 450 });
        }
        await flip(carta, true);
        fillLeyenda();
        if (swapIn) carta.classList.add('brilla');
        busy = false;
      });
    }
    return screen;
  }

  function act(fn) {
    try { fn(); return true; } catch (err) { toast(err.userError ? err.message : 'Algo ha fallado: ' + err.message); return false; }
  }

  function doKeep(id) {
    if (busy) return;
    if (!act(() => G.keep(state, id))) return;
    ui = state.phase === 'turns' ? { stage: 'cover' } : { stage: 'prereveal' };
    render();
  }

  function doSwap(id, oldCard, cartaEl) {
    if (busy) return;
    const nextId = nextOf(id);
    if (!act(() => G.swap(state, id))) return;
    const newCard = state.phase === 'turns' ? P(id).card : state.revealed.find((r) => r.playerId === id).card;
    ui = { stage: 'after', kind: 'swap', withId: nextId, oldCard, newCard };
    render();
  }

  function doDraw(id) {
    if (busy) return;
    const before = P(id).card;
    if (!act(() => G.draw(state, id))) return;
    const drawn = state.phase === 'turns' ? P(id).card : state.revealed.find((r) => r.playerId === id).card;
    ui = { stage: 'after', kind: 'draw', oldCard: before, newCard: drawn };
    render();
  }

  // --- después de cambiar o levantar: quien actuó ve su carta nueva ---
  function renderAfter() {
    const swap = ui.kind === 'swap';
    const carta = naipe(ui.oldCard, { up: true });
    const leyenda = h('div', { class: 'leyenda' });
    const roundOver = state.phase !== 'turns';
    const seguir = h('button', { class: 'btn oro', tap: () => {
      if (busy) return;
      ui = roundOver ? { stage: 'reveal', animate: true } : { stage: 'cover' };
      render();
    } }, roundOver ? 'Revelar cartas' : 'Tapar y pasar el móvil');
    seguir.disabled = true;

    const titulo = swap
      ? h('p', { class: 'muted' }, 'Le das tu carta a ', h('b', null, nameOf(ui.withId)), ' y te quedas con la suya.')
      : h('p', { class: 'muted' }, 'Levantas la carta de arriba de la baraja.');

    const screen = h('section', { class: 'screen' },
      h('header', { class: 'cabecera' }, h('button', { class: 'marca', html: RAT_SMALL, 'aria-label': 'Volver al inicio', tap: volverInicio }), h('span', { class: 'ronda' }, swap ? 'Cambio de carta' : 'Levantar baraja')),
      titulo,
      h('div', { class: 'mesa-grande' }, h('div', { class: 'carta-marco' }, carta,
        h('div', { class: 'sobre arriba' }, leyenda))),
      h('div', { class: 'acciones' }, seguir));
    screen.classList.add('turno');

    busy = true;
    requestAnimationFrame(async () => {
      await wait(250);
      await flip(carta, false);
      if (swap) {
        await anim(carta, [{ transform: 'none', opacity: 1 }, { transform: 'translateX(140%) rotate(14deg)', opacity: 0 }], { duration: 420, easing: 'cubic-bezier(.5,0,.8,.4)' });
        vibrate(30);
      } else {
        await anim(carta, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(60%) scale(.8)', opacity: 0 }], { duration: 380 });
      }
      const nueva = naipe(ui.newCard, { up: false });
      carta.replaceWith(nueva);
      await anim(nueva, swap
        ? [{ transform: 'translateX(140%) rotate(14deg)', opacity: 0 }, { transform: 'translateX(-6%) rotate(-2deg)', opacity: 1, offset: .75 }, { transform: 'none', opacity: 1 }]
        : [{ transform: 'translateY(-90%) rotate(-6deg) scale(.8)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 560 });
      await flip(nueva, true);
      nueva.classList.add('brilla');
      titulo.replaceChildren(...(swap ? ['Ahora tienes la carta de ', h('b', null, nameOf(ui.withId))] : ['Has sacado esta carta']));
      leyenda.replaceChildren(
        h('span', { class: 'carta-nombre' }, cardName(ui.newCard)),
        h('div', { class: 'orden' }, cardTags(ui.newCard)));
      seguir.disabled = false;
      busy = false;
    });
    return screen;
  }

  // --- antes de revelar ---
  function renderPrereveal() {
    return h('section', { class: 'screen' },
      cabecera(),
      h('div', { class: 'pasa' },
        h('span', { class: 'eyebrow' }, 'TODOS HAN JUGADO'),
        h('div', { class: 'abanico', 'aria-hidden': 'true' }, naipe(null), naipe(null), naipe(null)),
        h('h2', { class: 'quien' }, 'Dejad el móvil en el centro'),
        h('p', { class: 'muted' }, 'Las cartas se revelan a la vez para toda la mesa.')),
      h('div', { class: 'acciones' }, h('button', { class: 'btn oro', tap: () => { ui = { stage: 'reveal', animate: true }; render(); } }, 'Revelar cartas')));
  }

  // --- revelar ---
  function livesBefore(entryIndex, id) {
    return state.history[entryIndex].livesBefore[id];
  }

  function summary(entry) {
    const base = entry.losers.length > 1
      ? `Pierden ${entry.losers.map(nameOf).join(' y ')}: empatan con la carta más baja`
      : `Pierde ${nameOf(entry.losers[0])}: tiene la carta más baja`;
    return entry.tiebreak ? `${base}. Los últimos caen a la vez: siguen con 1 vida y repiten ronda.` : base;
  }

  function cronica(entry) {
    const lines = entry.actions.map((a) => {
      if (a.type === 'keep') return [h('b', null, nameOf(a.playerId)), ' se quedó su carta'];
      if (a.type === 'swap') return [h('b', null, nameOf(a.playerId)), ' cambió con ', h('b', null, nameOf(a.neighborId))];
      return [h('b', null, nameOf(a.playerId)), ' levantó baraja'];
    });
    for (const fx of entry.effects) {
      lines.push(fx.blocked
        ? [h('b', null, nameOf(fx.playerId)), ` tenía el ${fx.label}, pero con el pelle no suma vida`]
        : fx.lives < 0 ? [h('b', null, nameOf(fx.playerId)), ` · ${fx.label}: −${-fx.lives} vidas en total`]
          : [h('b', null, nameOf(fx.playerId)), ` · ${fx.label}: +${fx.lives} vida`]);
    }
    if (entry.eliminated.length) lines.push([h('b', null, namesOf(entry.eliminated)), ' queda fuera']);
    if (!lines.length) return null;
    return h('div', { class: 'cronica' }, lines.map((l) => h('p', null, l)));
  }

  function renderReveal() {
    const idx = state.history.length - 1;
    const entry = state.history[idx];
    const animate = ui.animate;
    ui.animate = false;

    const rejilla = h('div', { class: 'rejilla' });
    const cards = [];
    const extras = [];
    for (const r of entry.reveals) {
      const before = livesBefore(idx, r.playerId);
      const after = entry.livesAfter[r.playerId];
      const d = after - before;
      const isLoser = entry.losers.includes(r.playerId);
      const n = naipe(r.card, { up: !animate, cls: animate ? '' : (isLoser ? 'pierde' : '') });
      const delta = h('span', { class: `delta ${d < 0 ? 'menos' : d > 0 ? 'mas' : ''}` }, animate ? '' : d === 0 ? '♥' + after : `${d > 0 ? '+' : ''}${d} · ♥${after}`);
      const marca = isLoser ? h('span', { class: 'marca-pierde' }, 'LA MÁS BAJA') : null;
      if (marca && animate) marca.style.opacity = '0';
      rejilla.appendChild(h('div', { class: 'asiento' }, marca, n, h('span', { class: 'nm' }, r.name), delta,
        entry.eliminated.includes(r.playerId) ? h('span', { class: 'fuera' }, 'FUERA') : null));
      cards.push(n);
      extras.push({ n, delta, d, after, isLoser, marca });
    }

    const resumen = h('p', { class: 'muted' }, summary(entry));
    if (animate) resumen.style.visibility = 'hidden';
    const over = state.phase === 'over';
    const seguir = h('button', { class: 'btn oro', tap: () => {
      if (busy) return;
      if (over) { ui = { stage: 'over' }; render(); return; }
      if (!act(() => G.nextRound(state, state.hostId))) return;
      goAfterDeal();
    } }, over ? 'Ver quién gana' : 'Siguiente ronda');
    if (animate) seguir.disabled = true;

    const screen = h('section', { class: 'screen' },
      cabecera(),
      h('div', { class: 'resultado' }, h('span', { class: 'eyebrow' }, `RONDA ${entry.round}`), h('h2', null, 'Cartas boca arriba'), resumen),
      rejilla,
      cronica(entry),
      h('div', { class: 'acciones' }, seguir));

    if (animate) {
      busy = true;
      requestAnimationFrame(async () => {
        await wait(300);
        for (const c of cards) { c.classList.add('boca-arriba'); await wait(260); }
        await wait(500);
        for (const x of extras) {
          if (x.isLoser) { x.n.classList.add('pierde'); if (x.marca) { x.marca.style.opacity = ''; x.marca.classList.add('flota'); } }
          x.delta.textContent = x.d === 0 ? '♥' + x.after : `${x.d > 0 ? '+' : ''}${x.d} · ♥${x.after}`;
          x.delta.classList.add('flota');
        }
        resumen.style.visibility = '';
        vibrate(60);
        seguir.disabled = false;
        busy = false;
      });
    }
    return screen;
  }

  // --- fin de partida ---
  function renderOver() {
    const winner = state.winnerId ? P(state.winnerId) : null;
    const ranking = state.players.slice().sort((a, b) => b.lives - a.lives || Number(b.alive) - Number(a.alive));
    const screen = h('section', { class: 'screen' },
      cabecera(),
      h('div', { class: 'final' },
        h('div', { style: 'display:flex;gap:12px;align-items:center' }, h('span', { class: 'bandera', html: FLAG_ESPANA, style: 'width:54px' }), h('span', { class: 'corona-grande', html: CROWN }), h('span', { class: 'bandera', html: FLAG_BORGONA, style: 'width:54px' })),
        h('span', { class: 'eyebrow' }, winner ? 'GANA LA PARTIDA' : 'NADIE SIGUE VIVO'),
        h('h2', { class: 'ganador' }, winner ? winner.name : 'Sin ganador'),
        h('p', { class: 'muted' }, `Tras ${state.round} ronda${state.round === 1 ? '' : 's'}.`)),
      h('div', { class: 'clasif' }, ranking.map((p) => h('div', { class: `fila ${p.id === state.winnerId ? 'primero' : ''}` },
        h('span', null, p.name), h('span', { class: 'muted' }, p.alive ? `♥${p.lives}` : 'fuera')))),
      h('div', { class: 'acciones' },
        h('button', { class: 'btn oro', tap: () => {
          if (!act(() => { G.restartLobby(state, state.hostId); G.startGame(state, state.hostId); })) return;
          goAfterDeal();
        } }, 'Revancha con los mismos'),
        h('button', { class: 'btn fantasma', tap: () => { state = null; ui = { stage: 'setup' }; render(); } }, 'Cambiar jugadores')));
    if (winner && !reduceMotion) {
      const c = h('div', { class: 'confeti', 'aria-hidden': 'true' });
      const colors = ['#c8102e', '#f1bf00', '#c8102e', '#f1bf00', '#ffffff'];
      for (let i = 0; i < 60; i++) {
        c.appendChild(h('i', { style: `left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-duration:${2.2 + Math.random() * 2}s;animation-delay:${Math.random() * .8}s` }));
      }
      screen.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
    return screen;
  }

  // ---------- marcador y salir ----------
  function renderSheet() {
    document.querySelectorAll('.velo').forEach((v) => v.remove());
    if (!sheet || !state) return;
    const cerrar = () => { sheet = null; renderSheet(); };

    if (sheet === 'salir') {
      const velo = h('div', { class: 'velo centro' },
        h('div', { class: 'dialogo', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Terminar partida' },
          h('h3', null, '¿Terminar esta partida?'),
          h('p', { class: 'muted' }, 'Se pierden las vidas y el historial de esta partida.'),
          h('div', { class: 'duo' },
            h('button', { class: 'btn', tap: cerrar }, 'Seguir jugando'),
            h('button', { class: 'btn rojo', tap: () => { sheet = null; state = null; ui = { stage: 'setup' }; render(); } }, 'Terminar'))));
      document.body.appendChild(velo);
      return;
    }

    const jugadores = h('div', { class: 'jugadores' }, state.players.map((p) =>
      h('div', { class: `jug ${p.alive ? '' : 'fuera'}` },
        h('span', { class: 'nm' }, p.name),
        h('span', { class: 'vidas' }, p.alive ? `♥ ${p.lives}` : 'fuera'),
        h('button', { class: 'toggle', 'aria-pressed': String(!!p.pelle), tap: () => { act(() => G.togglePelle(state, state.hostId, p.id)); save(); renderSheet(); } }, p.pelle ? 'Tiene pelle' : 'Dar pelle'))));

    const historia = h('div', { class: 'historia' });
    state.history.slice().reverse().forEach((entry) => {
      historia.appendChild(h('div', { class: 'ent' },
        h('h3', null, `Ronda ${entry.round}`),
        h('p', null, entry.reveals.map((r) => `${r.name}: ${cardName(r.card)}`).join(' · ')),
        h('p', { class: 'muted' }, summary(entry))));
    });
    if (!state.history.length) historia.appendChild(h('p', { class: 'muted small' }, 'Aún no ha terminado ninguna ronda.'));

    const velo = h('div', { class: 'velo' },
      h('div', { class: 'hoja', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Marcador' },
        h('div', { class: 'hoja-cab' }, h('h2', null, 'Marcador'), h('button', { class: 'btn chico', tap: cerrar }, 'Cerrar')),
        h('p', { class: 'muted small' }, 'Quien tiene el pelle no recupera vida con el Rey de bastos.'),
        jugadores,
        h('span', { class: 'etiqueta' }, 'RONDAS'),
        historia,
        h('button', { class: 'btn fantasma', tap: () => { sheet = 'salir'; renderSheet(); } }, 'Terminar partida')));
    velo.addEventListener('click', (e) => { if (e.target === velo) cerrar(); });
    document.body.appendChild(velo);
  }

  load();
  if (!state) ui = { stage: 'setup' };
  render();
  setTimeout(preloadCards, 1500);
})();
</script>
